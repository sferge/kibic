# Stratégiasémák és általános szabályok — a felvevő tervező adatai
# (tervezet: claude/terv-sematar-2026-10-31.md)

- strategia: EGYETLEN_ESELY
  nev: "Egyetlen esély: egy technika a hiányzó ütésre"
  alkalmazhato: ["hiany >= 1"]
  technikak: {min: 1, max: 1}

- strategia: ESELYEK_KOMBINACIOJA
  nev: "Az esélyek kombinációja"
  alkalmazhato: ["hiany >= 1"]
  technikak: {min: 2, max: 3}
  minosites:
    # a felhasználó definíciója: próba, ha a kudarca még nem bukás
    proba: "kudarc_koltseg <= tartalek"
  kombinalas:
    # két vagy több technika egymás után csak akkor, ha az előzők kudarca még nem bukás
    - "elozok_probak"
    # egy korábbi technika nem fogyaszthatja el egy későbbi lapjait
    - "nincs_elfogyasztas"
  agak:
    # minden kör előtt (a technika első köre után) a tervező megfigyelésenként
    # dönthet: folytatja a technikát, vagy a következőre vált (a feltételes
    # esélyek összevetésével)
    valtas: igen

# --- Általános szabályok (minden technika minden körére) ------------------------

- szabalyok:
    - szabaly: ELLOPAS
      nev: "Ellopás: a mellékszín körét ellopja egy védő"
      # A kör r-edik a színben; a védő színhiányos (kezhossz < r), és van még adója
      # (az eddig lehúzott adukörök után). Felüllopni csak az a kezünk tudja, amely
      # utána jön, színhiányos, és minden kint lévő adunál nagyobb adója van.
      koltseg: 1
    - szabaly: KIADUZAS
      nev: "A kiaduzás helye"
      # A tervező a kiaduzás köreinek számát a technikák előtt választja meg (0..mind);
      # az adukör a kiaduzó kéz partneréből a legkisebb adut viszi, ezért elfogyaszthat
      # egy átmenetet (pl. az asztal ♣Q-ját).
      valasztek: [mind, 0, 1, 2, 3]
    - szabaly: ATMENET
      nev: "Átmenet a hívó kézbe"
      # Ha egy kört a másik kézből kell hívni: a cél kéz egy nyerő lapja, amely alá
      # a mostani kéz hívni tud; nem lehet a terv későbbi `hasznal` lapja. Az átmenet
      # maga is egy kör a színében (ELLOPÁS; aduban adukör).
      elonyben: nem_adu
    - szabaly: BEGYUJTES
      nev: "A begyűjtés halasztása"
      # A technika `begyujtes` köreit (biztos nyerők lehívása) a kiaduzás utánra
      # halasztjuk, ha a kiaduzó kéz elérhető (hívásban van, vagy lopással), az
      # adukontroll elég, és utána a begyűjtő lapok keze is elérhető. Ilyenkor a
      # begyűjtésnek nincs ellopási kockázata; ha nem halasztható, most játsszuk.
    - szabaly: SZABAD_HELYEK
      nev: "A szabad helyek elve (a hosszakból következő súlyozás)"
      # Egy védőnél annál valószínűbb egy lap, minél több szabad helye van. A
      # súlyozás egyelőre csak ISMERT hosszkülönbségből (megfigyelt: lejátszott
      # lapok, színhiány; bizonyított); a licitből feltételezett hosszból nem
      # (a szerkesztő döntése, 2026-10-31: sok parti statisztikája után oldható).
      tudas: [megfigyelt, bizonyitott]
    - szabaly: VEDOI_UTESEK
      nev: "A védők ütései, amikor hívásba jutnak"
      # Minden elvesztett ütés egy bejutás. Bejutáskor a védők a terv technikáinak
      # színein kívül (aduban az adun kívül) leviszik a mostani nyerőiket, és egy
      # színt — a versenyszínt — minden bejutáskor tovább hívnak: kiütik a
      # megállítónkat, a következő bejutáskor leviszik a színt. A plusz ütéseik a
      # tartalékot fogyasztják (a szükséges ütés a hátralévőkből: a vesztés összesen
      # legfeljebb a tartalék). Egyszerűsítés: a védők lapjai a színben közösen
      # (a nagy lapok a hívó kézben), a hosszuk az osztályé; a mi kezünk lopással
      # megállítja a színt. Csak a kockázattal számolt értékben.
    - szabaly: TERVEZES
      nev: "A tervezés lépcsői: felismerés, becslés, pontos számítás"
      # 1. felismerés: a technikák `felismeres` feltételei (olcsó jellemzők) szűrik,
      #    mivel érdemes számolni; 2. becslés: a drága (elemzős, többszínű) lépést
      #    tartalmazó tervek olcsó becslése (a technika `becsles` módja); 3. pontos
      #    számítás: a becslés szerinti legjobb `pontos` drága tervre, ha a becslése a
      #    legjobb ismert értéktől legfeljebb `sav`-val marad el. Ha így a legjobb terv
      #    `kiterjesztes_alatt` alatt marad, minden drága tervet pontosan számolunk.
      pontos: 3
      sav: 0.05
      kiterjesztes_alatt: 0.5
    - szabaly: RELEVANS_UTES
      nev: "Releváns ütés: mikor kell tervezni"
      # Nem az dönti el, ki hív, hanem hogy van-e döntésünk (a szerkesztő szabálya,
      # 2026-11-01). Védői hívásnál:
      #   1. nincs döntés — mindkét kezünk színt ad, egyik lapunk sem üti a hívottat:
      #      a legkisebb lapok (a magassá válható lap így megmarad);
      #   2. dobás — a védők viszik, de egyik kezünk színhiányos és nem lophat;
      #   3. ütés-döntés — üthetnénk vagy lophatnánk (ütés / kiengedés, melyik kézben,
      #      mivel lopunk; átvétel).
      # A 2. és 3. esetben a tervező az ütés lehetséges lépéseit (jelöltek) a
      # tervekkel együtt értékeli. Ha utána a védők hívnak, a következő hívásuk a
      # számunkra legrosszabb szín (sorsolt világokon, `visszahivas_melyseg`
      # mélységig; alatta úgy számolunk, mintha mi hívnánk).
      # Folytatólagosan: a második helyen ülő kezünk lapját az alap folytatással
      # (a 4. kéz üt, ha kell) értékeljük — ez a lap értékének alsó korlátja; a 4.
      # kéz többi lehetőségét csak a legjobbtól `folytatas_sav`-on belüli lapokra
      # számoljuk (a 4. kéz úgyis a 3. lap láttán dönt). 100%-os lap után nincs több.
      folytatas_sav: 0.10
      visszahivas_melyseg: 1
      vilagok: 300
    - szabaly: LEGHASZNOSABB_DOBAS
      nev: "Magas lapra a leghasznosabb dobás"
      # (a szerkesztő, 2026-11-19) A vesztőcserénél a dobó kéz abból a színből dob,
      # amelynek a vesztőit a terv más egysége nem kezeli (nem lopja, nem fejleszti,
      # nem impasszolja), és amelyben a legtöbb olyan vesztője van, amelyet a partner
      # sem lophat el. A tervkészítő a többi dobásszínt nem is jelöli.
      # Pl.: ha az egyik mellékszín a szöktetésé vagy a lopásé, a másikból dobunk.
      # Kód: tervkonyvelo.hasznos_dobas; kapcsoló: KIBIC_K_HASZNOS_DOBAS.
    - szabaly: DOBAS_ELOBB
      nev: "A dobás a kockázatos kör előtt"
      # (a szerkesztő, 2026-11-19) Színjátékban a vesztőt a magas lapra azelőtt dobjuk,
      # hogy a terv kockázatos körbe menne: kiadás, impassz vagy lopásos egység (a
      # mellékszín második köre ellopható). Pl.: a lopásos szín királyával át, a másik
      # szín magas lapjára a vesztő, és csak utána a lopásos szín ásza és a lopás. Az
      # átmenet lehet egy másik egység köre (közös lap). Forrás: BM A-2 #1. Kód: terv_fazis, tervjeloltek; kapcsoló: KIBIC_K_DOBAS_ELOBB.
    - szabaly: ATMENET_VEDES
      nev: "A terv által igényelt átmenetek védése"
      # (a szerkesztő, 2026-11-20) Ha az ütés így is, úgy is a miénk, azt a lapot
      # tesszük, amely után a terv hátralévő része a legjobban végrehajtható: megmarad
      # az az átmenet, amelyet a terv igényel — akár egy rövid szín kezébe is, ha a terv
      # onnan hív. Nem a „hosszú szín” a mérce: lehet, hogy az nem igényel külső
      # átmenetet, vagy nem is magas. A színkezelő elemzőnél a kezelés esélye a
      # megmaradó átmenetekkel; a többi egységnél a következő kör hívó kezének
      # elérhetősége. Pl.: A2 / KQ mellett a védő hívására a kéz az ásszal üti át a
      # partner figuráját, és a kis lap megmarad átmenetnek. Második kézen is: ha a
      # partner (negyedik kéz) is üthetne, de az ő nyerője a terv átmenete, mi ütünk
      # (a védő treffhívására a kéz ♣A-ja, az asztal ♣KD-je a két impassz átmenete
      # marad). Forrás: BM A-2 #3, #5.
      # Kód: Vegrehajto._atmenet_vedes; kapcsoló: KIBIC_K_ATMENET_VEDES.
    - szabaly: ADU_IGENY
      nev: "Az aduszín gondja csak az aduszínben oldható meg"
      # (a szerkesztő, 2026-11-20) Az aduszín vesztőtöbbletét (a vesztők a keret fölött)
      # csak az aduszín kezelése fedheti; a lopás és a dobás csak a mellékszínek
      # vesztőire számít. A rövid aduval lopva amúgy is magas lapot lopnánk; a hosszú
      # aduval lopva a kiadó magas aduk kiadók maradnak. Ha van ilyen többlet, a terv
      # nem lehet meg aduszín-egység nélkül. Forrás: BM A-2 #4.
      # Kód: tervjeloltek (adu_igeny); kapcsoló: KIBIC_K_ADU_IGENY.
    - szabaly: DEBLOKK
      nev: "Deblokk a zárt színben"
      # Ha a színben minden kör a miénk (a két kéz felső lapjai elég kört visznek), a
      # rövidebb kéz a nagy lapját adja, hogy a hosszú kéz lapjai ne ragadjanak be. Pl.:
      # Ax / KQJx — a védő hívására a rövid kéz az ászt teszi. Forrás: BM A-2 #4.
      # Kód: Vegrehajto._deblokk; kapcsoló: KIBIC_K_DEBLOKK.
    - szabaly: ADU_LEALLAS
      nev: "Nem aduzunk tovább, ha a védők adui beleférnek a keretbe"
      # (a szerkesztő, 2026-11-20) Nem hívunk több adut, ha mind a négy feltétel áll:
      # 1. a védők maradék adui mind nagyobbak a mieinknél (minden további adukör csak
      #    kiadás, és két adunkba kerül);
      # 2. a többi vesztővel együtt beleférnek a kiadási keretbe;
      # 3. egy lopás csak egy ütésbe kerül: a lopás után a védő bármit hív, abban a
      #    kézben, amelyben a hosszú nyerők vannak, visszaszerezzük a hívást (ott nyerő
      #    van, vagy a szín üres és van adu) — a szerkesztő ellenpéldája: ha a hosszú
      #    színbe csak abban a színben van átmenet, a védő az utolsó átmenetnél lop be, a
      #    többi nyerő beragad, és a másik kéz vesztői nem dobhatók rá;
      # 4. a terv nem vár dobást a hosszú adus kézből.
      # Ilyenkor a magas lapjainkat hívjuk, és hagyjuk, hogy ellopják. Pl.: Axxxx /
      # xxx, a kéz egy színben üres — az első lapot ellopjuk, az ászt lehívjuk, és
      # megállunk. Forrás: BM A-2 #4. Kód: Vegrehajto._adu_leallas;
      # kapcsoló: KIBIC_K_ADU_LEALLAS.
    - szabaly: ATMENET_ELOSZTAS
      nev: "Ha két kezelés ugyanazokra az átmenetekre számít, a terv osztja el őket"
      # (a szerkesztő, 2026-11-20) A két színkezelés együttes esélye legyen a legnagyobb.
      # Pl.: a pikk két impassza csak egyféleképpen oldható meg, és mindkét asztalra
      # menetet igényli — az aduszín kezelésére nem marad asztalra menet, ott csak a
      # kézből indított kezelés (az eltalálás) marad. Forrás: BM A-2 #5.
      # Kód: Vegrehajto._atmenet_elosztas; kapcsoló: KIBIC_K_ATMENET_ELOSZTAS.
      # A mostani hívás is átmenet (a szerkesztő, 2026-11-21): ha a hívás abban a
      # kézben van, ahonnan a másik kezelés indul, és így a kettő együtt jobb, most a
      # másik kezelés köre jön. Pl.: a védő hívására az asztal üt — onnan a pikk
      # impassz jön, és az (ha sikerül) a kézbe hoz az aduzás folytatásához; a kőr az
      # asztalról az impassz átmenetét vinné el. A mérlegelésben a másik kezelés köre
      # ott végződik, ahol a színben a nagyobb lapunk van.
      # Kód: Vegrehajto._hivas_atadasa; kapcsoló: KIBIC_K_HIVAS_ATADAS.
    - szabaly: MEGFIGYELT_NYERO
      nev: "A látott lapok szerint biztos ütés: a legolcsóbb"
      # (a szerkesztő, 2026-11-21) Második vagy harmadik kézben az a lap is biztos ütés,
      # amelyet a még tevő védő a lement lapokkal összeférő tartások egyikében sem tud
      # megütni. Ha egy korábbi körben a negyedik kéz védője nem ütött fölé, pedig
      # tudott volna, az ilyen tartás kiesik: a sikerült impassz után a király nem a
      # mögötte ülőnél van, így a villába hívott színre a dáma elég, nem kell az ász.
      # Kód: Vegrehajto._megfigyelt_nyero; kapcsoló: KIBIC_K_MEGFIGYELT_NYERO.
    - szabaly: MAGAS_LOPAS
      nev: "Magasan lopunk, ha felüllophatnak"
      # Ha utánunk még védő jön, aki már kimutatott a színből (vagy alig van kint
      # belőle), annyira magasan lopunk, hogy csak a természetes aduütései (a mi
      # legnagyobb adunk fölötti lapjai) üthessék felül — azok úgyis ütnek.
      # Kód: Vegrehajto._lopo_lap; kapcsoló: KIBIC_K_MAGAS_LOPAS.
    - szabaly: KENYSZERHIVAS
      nev: "Kényszerhívás: a bedobott védő hívására dob-lop, impasszba hívás, fagyott szín"
      # (a szerkesztő, 2026-11-21; forrás: BM A-6 #1) A BEDOBAS technika (technikak.yaml)
      # összeillesztési oldala. Ha a védő hív, és:
      #   * mindkét kezünk üres a színben (eliminált szín) — DOB-LOP: az egyik kéz lop, a
      #     másik egy vesztőt dob (a dobás +1 ütés);
      #   * a színben villánk van (kétirányú villa, fagyott szín) — IMPASSZBA: második
      #     kézben a legkisebb lap, negyedik kézben a legolcsóbb, amely üt (ha a partner
      #     nem üt).
      # A kényszerszín feltétele (tervbedobas.vedo_hivas_nyer): bárhogy oszlik el, és
      # bármit hív és tesz a védő, így egy ütéssel többet viszünk a biztos ütéseinknél.
      # Elimináció (tervbedobas.eliminalhato): tükörszín — a két kézben egyforma hosszú,
      # és a nyerőink lehívásával mindkét kezünkből elfogy. Lopással is (BM A-6 #2): az
      # egyik kéz a nyerőkre követ, aztán a másik kéz maradékát lopja — ezt egy lopó
      # egység (pl. ASZTALFORDITAS) végzi, a bedobás csak vele együtt jelölt. A bedobó
      # színben a kiadások száma a rövidebb kéz vesztőinek száma (legfeljebb 2); ha a
      # hosszabb kézben marad lap, a dobás abból megy (így a szín mindkét kézből elfogy,
      # a védőnek nem marad biztonságos kijátszása). Fagyott szín: Dxx / Bxx — a
      # kényszerszín feltétele rekurzív: amíg a védő üt, ő hív tovább. Feltétel még: a
      # kiaduzás után legalább az egyik kezünkben marad adu.
    - szabaly: TERV_MEGTARTAS
      nev: "A terv addig marad, amíg nem borul"
      # (a szerkesztő, 2026-11-21) „Újratervezés kell(het), de csak akkor, ha borul a
      # terv.” „A terv esélyének csökkenése azt jelenti, hogy valami alapvetően
      # megváltozott.” Új információnál (kimutatás: egy védő nem követ egy színt) nem
      # tervezünk újra, hanem megmérjük a mostani terv esélyét a látott lapokkal összeférő
      # elosztásokon: a terv a tervezés pillanatától indul, a valóban lement lapokat
      # lejátssza, aztán a mindent látó védők ellen megy tovább. Új terv csak akkor jön,
      # ha az esély érezhetően csökkent: nullára esett, vagy legalább 10 ponttal és a
      # mintavétel kétszeres szórásával. Különben a terv marad, a mért esély lesz a
      # következő összevetés alapja. (Ez váltja fel a kimutatásos kivételeket: az
      # elemzős színt és a biztos egységet.) Változatlanul új terv jön, ha a mi oldalunk
      # eltér a tervtől, vagy egy egység elakad.
      # Kód: tervmuhely.terv_esely_most, terv_borult; kapcsoló: KIBIC_K_TERV_MEGTARTAS.
    - szabaly: ATMENET_ADUKOR
      nev: "Az utolsó (adu)átmenet előtt annyi magas adu a kézből, amennyit a terv elbír"
      # (a szerkesztő, 2026-11-21, BM A-6 #2) A sémák összeillesztése a kockázatok
      # (felüllopás, ellopás) legkisebbre csökkentésével. A szabály akkor fontos, ha az
      # aduval való átmenet az utolsó lehetőség a partnerhez (nincs más átmenet a terv
      # végrehajtásához). Ilyenkor előbb annyi magas adut hívunk a kézből, amennyi a terv
      # végrehajtását nem veszélyezteti: a kézben megmarad a lopásaira szánt adu, és ha a
      # terv bedobással zárul, még egy — különben nem marad dob-lop fenyegetés (BM A-6 #2:
      # három adukör és két lopás után a hosszú adus kézben minden adu elfogyna). (A 12:07-es
      # első változat merev volt: „egy magas adu, ha még marad nyerő adu és lopás jön”.)
      # Ugyanez az elv az ASZTALFORDITAS köreiben: a lopás előtt csak annyi magas lapot
      # hívunk, amennyi a lopó kéz kiürítéséhez kell; a többi magas lapot (és rá a dobást)
      # az aduzás után, az utolsó lopás előtt — amíg az asztalon vagyunk.
      # Kód: Vegrehajto._atmenet_jeloltek; kapcsoló: KIBIC_K_ATMENET_ADUKOR.
    - szabaly: BEDOBAS_TARTALEK
      nev: "A bedobás tartaléka: a kényszerszín saját kezelése, ha a bedobás borul"
      # (a szerkesztő, 2026-11-21, BM A-6 #3) A kényszerszín (pl. kétirányú villa) egysége
      # a bedobás mögött várakozik: amíg a bedobás körei tartanak, nem nyúlunk a színhez;
      # sikeres bedobás után elmarad (a színt a védő nyitja). Ha a kiadó szín az adu, és
      # a felső aduk után egynél több adu maradt kint (4-1), a nyerő védő adut hívhat
      # vissza — a bedobás borul, és a tartalék (pl. a ♦ impassz) indul. Ha a kiadandó
      # vesztő eltűnik (a dáma leesett), nincs kiadás, a terv teljesült.
      # Kód: Vegrehajto._bedobasra_var, _bedobas_borult, _bedobas_folosleges;
      # kapcsoló: KIBIC_K_BEDOBAS_TARTALEK.
    - szabaly: BIZTONSAGI_KEZELES
      nev: "A szín biztonsági kezelése: a kötelező ütésszám a teljes vesztéskerettel, a legnagyobb biztonságra"
      # (a szerkesztő, 2026-11-21, BM A-6 #4) „N kiadóval M ütés P valószínűséggel”: M a
      # színben kötelezően teljesítendő ütésszám, N + M a szín hossza, és N-et úgy
      # választjuk, hogy P a legnagyobb legyen. Nem a legtöbb elérhető ütés a cél, hanem a
      # legnagyobb biztonság (csapatversenyen; párosversenyen más lehet a célfüggvény).
      # CSAK ABBAN AZ ESETBEN érvényes, ha ez a teljesítés egyetlen feltétele: a többi
      # színben nincs feladat (minden szín zárt, vagy a vesztőit egy ütközésmentes biztos
      # egységkészlet — lopás, dobás — eltünteti; BM A-6 #4: a kézi ♦ vesztő a magas
      # kőrre esik). Ha más színben is van feladat, kombinációs játék kell: a sémákat úgy
      # kombináljuk, hogy egymás után végrehajthatók legyenek (az egyik sikere vagy
      # kudarca ne befolyásolja a folytatást), és az esélyeik összeadódjanak — egyik
      # szín sem rögzíthető a maximuma alatt.
      # Az aduszínben eddig csak a legszigorúbb cél volt jelölt (a biztos vesztőkkel): a
      # teljes kerettel számolt kezelés „nem hoz ütést” (a várható vesztők alatt marad),
      # ezért kimaradt, és az adut a kiaduzás egyszerű lehívása kezelte. Most a teljes
      # vesztéskeretű aduszín-kezelés is jelölt, ha a legrosszabb elosztás több vesztőt ad
      # a keretnél: ez véd meg tőle. Minta: ♠KB98 / ♠A432, hiányzik a D10765, egy vesztés
      # fér bele: a ♠8-at hívjuk, az asztal kicsit tesz — legfeljebb egy aduvesztő.
      # Kód: _egyetlen_feladat, szinkezeles_peldanyok, szinkezeles_peldany(biztonsagi); kapcsoló:
      # KIBIC_K_BIZTONSAGI_KEZELES.
    - szabaly: KOMBINACIO
      nev: "Kombinációs játék: egymás után végrehajtható esélyek, közös vesztéskerettel"
      # (a szerkesztő, 2026-11-21, BM A-11) Ha több színben van feladat, a sémákat,
      # esélyeket úgy kombináljuk, hogy mindegyik végrehajtható legyen egymás után (az
      # egyik sikere vagy kudarca ne befolyásolja a folytatást), és így az esélyeik
      # összeadódjanak. A kombináció nem jelentheti, hogy egy színt a maximuma alatt
      # rögzítünk, és PONTOS kell legyen: 6NT, ♦QJ2 / ♦K9876, ♣AKQ109 / ♣32 — a káró 3
      # ütésért (egy kiadással, a ♦B-vel indulva) úgy, hogy a 2 ütés nincs kockáztatva:
      # 3 ütés = megoldja a partit, 2 ütés = a treff még egy esély. A ♦A kiadása után a
      # treff már nem veszíthet. Két része:
      #   1. pontos cél: ha egy szín magában megoldja a partit (a kezelése ugyanazzal a
      #      vesztéskerettel fedi az igényt), a többi esélyt is tartalmazó tervben nem
      #      szerepelhet a maximuma alatti céllal;
      #   2. közös vesztéskeret: a végrehajtóban egy színkezelés legfeljebb annyit
      #      veszíthet, amennyi a teljes keretből még megmaradt (a ♦A után a ♣ vesztés
      #      nélkül, a látott lapok szerinti legbiztosabb módon).
      # (Egy merev változat — a tervben a színkezelések vesztéskeretének összege nem
      # haladhatja meg a megengedett kiadást — több partin rontott: a keret felső korlát,
      # a tényleges vesztés kisebb.)
      # Kód: tervjeloltek (megoldo, hozzaad), Vegrehajto._politika; kapcsoló:
      # KIBIC_K_KOMBINACIO.
    - szabaly: HIVASRA_TETT_LAP
      nev: "A védő hívására tett lapunk is a terv része"
      # (a szerkesztő, 2026-11-22, BM A-12) 5♠, Nyugat ♦10-zel indul, az asztalon ♦D94,
      # a kézben ♦K32. A ♦4-gyel a ♦K üt, és ha Nyugat (a veszélyes kéz) később a ♣Á-val
      # ütésbe kerül, a ♦D-n át hív Kelet ♦ÁB-je felé: két káróütés. A ♦D-vel: ha Kelet
      # üt, a ♦K védett, a ♦9 a harmadik körben nyerő; ha nem üt, a D üt. Ha a folyó
      # ütésben (a védő hívott) mi teszünk, a terv lapja dönt: minden szabályos lapunkkal
      # lefuttatjuk a jelölt terveket ugyanazokon a világokon, és ha valamelyik lap
      # legalább 5 ponttal jobb esélyt ad, az lesz a terv lapja (a szélső lapok előbb).
      # Kód: tervmuhely._hivasra_tett_lap, Rekord.elso_lap, Vegrehajto.kenyszer; kapcsoló:
      # KIBIC_K_HIVASRA_TETT_LAP.
    - szabaly: IGENY_TOBBLET
      nev: "A jelöltek az igényre és eggyel több forrásra"
      # (BM A-12) A felmérés igénye becslés: az A-12-n 1, de a ♣-ból két ütés kell (a
      # második káróvesztőt a treffre dobjuk). A jelöltek az igény szerinti és eggyel
      # nagyobb igényű tervek együtt; az előzetes esély szerint a legjobbak mennek a
      # szimulációba, ott dől el. Kód: tervmuhely.tervez; kapcsoló: KIBIC_K_IGENY_TOBBLET.
    - szabaly: ELLENFEL_INDITASA
      nev: "Az indító lap a védők megállapodása szerinti lap"
      # (BM A-12) Az indítás a védők (bejelentett) megállapodása: a sorozat teteje, a dubló
      # felső lapja, háromból kicsi; színfelvétel ellen ász alól nem indulnak (ASZ_ALOL).
      # A ♦10 indulás: Nyugatnál nincs a ♦B (B10-ből a B jönne), és nincs a ♦Á. Ez nem
      # a védők lapválasztásáról tett feltevés játék közben, hanem a megállapodásuk —
      # ezért SÚLYOZÁS, nem kizárás: az ellentmondó világ 5% eséllyel marad a mintában.
      # (Kicsi súly kell: az egyenletes mintában az indításhoz illő Nyugat-kéz csak ~6%,
      # 20%-os súllyal az ellentmondó kezek döntenének. A-12, DD a ♦D-vel / ♦4-gyel: az
      # illő kezeken 80% / 41%, súly nélkül 50% / 72%.)
      # A rendszer: KIBIC_ELLENFEL_JELZES (alap: MOHA_STAND), a súly:
      # KIBIC_ELLENFEL_INDITAS_SULY. Kód: tervmuhely.inditas_osszhang, _vilagok; kapcsoló:
      # KIBIC_K_ELLENFEL_INDITASA.
