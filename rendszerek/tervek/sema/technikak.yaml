# Technikasémák — a felvevő tervező adatai (tervezet: claude/terv-sematar-2026-10-31.md)
#
# Egy technika: egy (ritkán két) színben végrehajtható elemi eljárás. A sor
# felépítése:
#   szerepek      a szín lapjainak és kezeinek szerepe; a LÁTOTT lapokból számolt
#                 kifejezések (a fogalmak: motor/tervsema.py FOGALMAK), sorrendben
#   alkalmazhato  a látott lapokra vonatkozó feltételek (mind igaz → a technika
#                 erre a színre alkalmazható)
#   korok         a kotta: körönként a kör fajtája (lehiv / impassz / lop), a hívó
#                 kéz és a lap; `ismetles`: ennyiszer (a lista lapjain sorban);
#                 `csak_ha: siker` — a kört csak akkor játsszuk, ha a technika
#                 sikerült (ez a megfigyelésből látszik); `begyujtes: igen` — a
#                 biztos nyerők lehívása: a kiaduzás utánra halasztható, ha a
#                 kiaduzó kéz és utána a lapok keze is elérhető (BEGYUJTES szabály)
#   siker         REJTETT feltétel: csak a valószínűség-számoló értékeli (a
#                 végrehajtás sosem ágazik el rá közvetlenül)
#   kudarc_koltseg  ennyi ütést ad ki a kudarc (0: próba, ha a tartalék engedi)
#   hozam         ennyi ütéssel csökkenti a hiányt, ha sikerült
#   hasznal       a lapjaink, amelyekre a technikának szüksége van (ezeket más
#                 technika nem fogyaszthatja el előtte, és átmenetnek sem adjuk)
#   elfogyaszt    a lapjaink, amelyeket a technika elhasznál
#
# A kockázatokat (ellopás, felüllopás) NEM a technika írja le: az ELLOPÁS
# általános szabály minden mellékszínkörre érvényes, amíg a védőknél adu van
# (strategiak.yaml).
#
# Öröklés: `valtozat` + `alap` (a tervtár szokása); `felulir` a megadott mezőket
# cseréli.

- technika: EJTES
  nev: "Ejtés: a hiányzó figura leejtése a felső lapokkal"
  szerepek:
    F: "legnagyobb_kint(SZ)"
    FELSO: "felettunk(SZ, F)"
    M: "kozvetlen_alatta(SZ, F)"
    N: "hossz(FELSO)"
  alkalmazhato: ["nem_adu(SZ)", "van(F)", "van(M)", "N >= 1", "kezhossz(keze(M), SZ) >= N + 1"]
  korok:
    - {ismetles: "N", fajta: lehiv, lap: FELSO}
    - {fajta: lehiv, lap: "[M]", csak_ha: siker, begyujtes: igen}
  siker: "figura_hossz(F) <= N"
  kudarc_koltseg: 0
  hozam: 1
  hasznal: [FELSO, "[M]"]
  elfogyaszt: [FELSO, "[M]"]

- technika: IMPASSZ_VILLA
  nev: "Impassz a villa felé (a villa alsó lapja üt, ha a figura a második kéznél van)"
  szerepek:
    F: "legnagyobb_kint(SZ)"
    V: "kozvetlen_alatta(SZ, F)"
    VK: "keze(V)"
    HK: "partner(VK)"
    FELETTE: "felettunk_kezben(VK, SZ, F)"
    # deblokk csak akkor kell, ha a hívó kéz a rövidebb: a hosszú kéz felső lapja nem
    # blokkol (4V01 #1: ♥KJ / ♥AT943 — az ász előzetes lehívása tönkretenné a villát)
    DEBLOKK: "ha(kezhossz(HK, SZ) <= kezhossz(VK, SZ), felettunk_kezben(HK, SZ, F), [])"
  alkalmazhato: ["nem_adu(SZ)", "van(F)", "van(V)", "hossz(FELETTE) >= 1",
                 "kezhossz(HK, SZ) > hossz(DEBLOKK)",
                 "kezhossz(VK, SZ) > hossz(FELETTE) + hossz(DEBLOKK) or hossz(DEBLOKK) == 0"]
  korok:
    - {ismetles: "hossz(DEBLOKK)", fajta: lehiv, lap: DEBLOKK}
    - {fajta: impassz, hivo: HK, lap: V}
    - {ismetles: "hossz(FELETTE)", fajta: lehiv, lap: FELETTE, begyujtes: igen}
  siker: "birtokos(F) == bal(HK) or figura_hossz(F) <= hossz(DEBLOKK)"
  kudarc_koltseg: 1
  hozam: 1
  hasznal: ["[V]", FELETTE, DEBLOKK]
  elfogyaszt: ["[V]", FELETTE, DEBLOKK]

- technika: IMPASSZ_ATENGEDES
  nev: "Impassz a sorozat hívásával és átengedésével (a figura a második kéznél)"
  szerepek:
    F: "legnagyobb_kint(SZ)"
    V: "kozvetlen_alatta(SZ, F)"
    VK: "keze(V)"
    SOR: "sorozat_lefele(V)"
    FELETTE: "felettunk_kezben(partner(VK), SZ, F)"
  alkalmazhato: ["nem_adu(SZ)", "van(F)", "van(V)", "hossz(SOR) >= 2", "hossz(FELETTE) >= 1",
                 "hossz(felettunk_kezben(VK, SZ, F)) == 0"]
  korok:
    - {fajta: impassz, hivo: VK, lap: V}
    - {ismetles: "hossz(FELETTE)", fajta: lehiv, lap: FELETTE, begyujtes: igen}
  siker: "birtokos(F) == bal(VK)"
  kudarc_koltseg: 1
  hozam: 1
  hasznal: [SOR, FELETTE]            # a sorozat lapjai is kellenek (ismételt átengedés, kimagasodás)
  elfogyaszt: ["[V]", FELETTE]

- valtozat: IMPASSZ_ATENGEDES_FELSO_ELOBB
  alap: IMPASSZ_ATENGEDES
  nev: "Impassz átengedéssel, előbb egy felső lap (a szingli figura ellen)"
  felulir:
    korok:
      - {fajta: lehiv, lap: "elso(FELETTE)"}
      - {fajta: impassz, hivo: VK, lap: V}
      - {ismetles: "hossz(FELETTE) - 1", fajta: lehiv, lap: "tobbi(FELETTE)", begyujtes: igen}
    siker: "birtokos(F) == bal(VK) or figura_hossz(F) == 1"

- technika: LOPASOS_KIMAGASITAS
  nev: "Lopásos kimagasítás: egy lap kimagasítása a szín ellopásával (ruff out)"
  # Nem „lopással szerzett plusz ütés”: ha a hosszú aduból lopunk, az aduütések
  # száma nem nő; az ütés a kimagasított lapból (M) jön.
  szerepek:
    F: "legnagyobb_kint(SZ)"
    L: "rovidebb_adus_kez(SZ)"
    MK: "partner(L)"
    M: "legnagyobb_alatta_kezben(MK, SZ, F)"
    FELSO: "felettunk(SZ, F)"
    N: "kezhossz(L, SZ) + 1"
  alkalmazhato: ["nem_adu(SZ)", "van(F)", "van(L)", "van(M)", "hossz(FELSO) >= N - 1",
                 "kezhossz(MK, SZ) >= N + 1", "adu_kezben(L) >= 1"]
  korok:
    - {ismetles: "N - 1", fajta: lehiv, lap: FELSO}
    - {fajta: lop, hivo: MK, lopo: L}
    - {fajta: lehiv, hivo: MK, lap: "[M]", csak_ha: siker, begyujtes: igen}
  siker: "figura_hossz(F) <= N"
  kudarc_koltseg: 0
  hozam: 1
  hasznal: [FELSO, "[M]"]
  elfogyaszt: [FELSO, "[M]"]

- technika: LOPASOS_KIMAGASITAS_HOSSZ
  nev: "Lopásos kimagasítás a hosszú lapokra: előbb a kis lapokat lopjuk, a felső és a hosszú lapok a kiaduzás után"
  # A szerkesztő (2026-11-03, MB 6♦): „Csak annyit KELL lehívni, ami után a szín már
  # lopható” — a színhiányos kéz rögtön lophat: a kis lapokat lopjuk (a felüllopás csak
  # nagyon rossz elosztásnál fenyeget: a lopó mögött ülő védő már az első körökben
  # színhiányos), és a felső lapokat a hosszú lappal együtt a kiaduzás után hívjuk le
  # (BEGYUJTES: nincs ellopási kockázat). A lopások száma a legegyenletesebb elosztáshoz
  # kell (a kint lévők fele felfelé, a felső lapjaink nélkül); ha a védők hosszabb fele
  # ennél hosszabb, a hosszú lap nem magas — nem hívjuk le (kudarc, vesztés nélkül).
  szerepek:
    F: "legnagyobb_kint(SZ)"
    L: "rovidebb_adus_kez(SZ)"
    MK: "partner(L)"
    FELSO: "felettunk(SZ, F)"
    R: "fele_felfele(kint_db(SZ)) - hossz(FELSO)"
    KICSI: "kicsik_kezben(MK, SZ, F)"
    HOZAM: "kezhossz(MK, SZ) - R - hossz(FELSO)"
    HOSSZU: "elejen(KICSI, HOZAM)"
  alkalmazhato: ["nem_adu(SZ)", "van(L)", "kezhossz(L, SZ) == 0", "R >= 1", "HOZAM >= 1",
                 "adu_szabad(L) >= R", "hossz(felettunk_kezben(MK, SZ, F)) == hossz(FELSO)"]
  korok:
    - {ismetles: "R", fajta: lop, hivo: MK, lopo: L}
    - {ismetles: "hossz(FELSO)", fajta: lehiv, lap: FELSO, begyujtes: igen}
    - {ismetles: "HOZAM", fajta: lehiv, lap: HOSSZU, csak_ha: siker, begyujtes: igen}
  siker: "max_vedo_hossz(SZ) <= R + hossz(FELSO)"
  kudarc_koltseg: 0
  hozam: "HOZAM"
  hasznal: [FELSO, HOSSZU]
  elfogyaszt: [FELSO, HOSSZU]

- technika: LOPAS_ROVID_KEZBEN
  nev: "Lopás a rövid adus kézben: a hosszú adus kéz vesztőit a rövid adus kéz lopja"
  # Játékmód: LOPAS_ROVID_KEZBEN (jatekmodok.yaml). A rövid adus kéz lopása plusz
  # aduütés (a hosszú adus kéz aduit a felső ütések már számolják) — ezért a lopó kéz
  # legfeljebb annyi adus, mint a partnere (egyenlő adunál bármelyik). Először a
  # lopó kéz lapjait a felső nyerőkkel elfogyasztjuk (kiadás nélkül: ez még nincs a
  # kották között), utána a partner kis lapjait lopjuk; a felüllopás az ELLOPÁS
  # szabályé (a lopó adu, ha minden kint lévőnél nagyobb, nem lopható felül). A
  # maradék nyerőket a terv lezárása gyűjti be.
  szerepek:
    F: "legnagyobb_kint(SZ)"
    L: "rovid_adu_lopo(SZ)"
    MK: "partner(L)"
    N: "kezhossz(L, SZ)"
    NYERO: "felettunk(SZ, F)"
    # a lopások száma: ahány vesztője van a partnernek, ahány adója a lopónak — de csak
    # amennyi a hiányhoz kell (minden fölösleges lopás felüllopási kockázat)
    R: "min(kezhossz(MK, SZ) - max(N, hossz(NYERO)), adu_szabad(L), max(1, hiany()))"
  alkalmazhato: ["nem_adu(SZ)", "van(L)", "hossz(NYERO) >= N", "R >= 1"]
  korok:
    - {ismetles: "N", fajta: lehiv, lap: NYERO}
    - {ismetles: "R", fajta: lop, hivo: MK, lopo: L}
  siker: "True"                      # rejtett feltétel nincs: a kockázat a felüllopás (ELLOPÁS)
  kudarc_koltseg: 0
  hozam: "R"
  hasznal: [NYERO]
  elfogyaszt: [NYERO]

- technika: SZINKEZELES
  nev: "Színkezelés: az egyszínű elemző kezelése (k ütés legfeljebb m vesztéssel)"
  # A kotta és a siker az egyszínű elemzőből jön (motor/tervszinkezeles.py): a
  # felvevő a látott lapokon dönt, a védők a cél ellen játszanak. A tervező a
  # színre a célokat a helyzetből állítja: k = a biztos ütések + 1 … (a hiányig),
  # m = 0 … a tartalék; lopás a rövidebb, adus kezünkkel. A hozam tartásonként a
  # szín ütései a biztoson felül, a költség a vesztett ütések. Az átmeneteket és
  # a hívás helyét a tervező adja át (a védő a legrosszabb kezünkbe hív vissza).
  fajta: elemzo
  celok:
    egyszin: {vesztes: tartalek, lopas: igen}
    # Az adu és egy mellékszín együtt (többszínű elemző): az adu körei átmenetek,
    # a lopások ideje a kiaduzáshoz képest. Drága (percek), ezért:
    aduval:
      # felismerés: csak ahol a rövidebb kezünk lophat a színben
      felismeres: ["nem_adu(SZ)", "lophat(SZ)"]
      # becslés (a tervek rangsorához): a két szín külön, az egyszínű elemzővel,
      # korlátlan átmenettel; a pontos elemzés csak a legjobb jelöltekre (TERVEZES)
      becsles: kulon_szinek


# --- 2026-11-18: a tervkészítés átépítése (a szerkesztő leírása szerint) ---------------
# Új körfajta: `kiad` — a hívó kéz a színből a legkisebb szabad lapját hívja, a kört
# átengedjük (a kiadás a megengedett kiadásból fogy). A `hasznal` lapjait nem adja.

- technika: SZOKTETES
  nev: "Szöktetés: kicsi a magányos figura felé (a hiányzó nagyobb figura a második kéznél)"
  # A szerkesztő (2026-11-18, MB 4♠): ♦Q982 / ♦A1043 — „a ♦D-t szöktetésre kell
  # játszanom”. A figura (V) kezében nincs fölötte lap (különben villa: IMPASSZ_VILLA);
  # a felső lap (pl. az A) a másik kézben lehet. A hívás a másik kézből jön.
  szerepek:
    F: "legnagyobb_kint(SZ)"
    V: "kozvetlen_alatta(SZ, F)"
    VK: "keze(V)"
    HK: "partner(VK)"
    FELETTE: "felettunk_kezben(HK, SZ, F)"
  alkalmazhato: ["nem_adu(SZ)", "van(F)", "van(V)", "hossz(felettunk_kezben(VK, SZ, F)) == 0",
                 "kezhossz(HK, SZ) >= hossz(FELETTE) + 1", "kezhossz(VK, SZ) >= 2"]
  korok:
    - {fajta: impassz, hivo: HK, lap: V}
    - {ismetles: "hossz(FELETTE)", fajta: lehiv, lap: FELETTE, begyujtes: igen}
  siker: "birtokos(F) == bal(HK)"
  kudarc_koltseg: 1
  hozam: 1
  hasznal: ["[V]", FELETTE]
  elfogyaszt: ["[V]", FELETTE]

- valtozat: SZOKTETES_FELSO_ELOBB
  alap: SZOKTETES
  nev: "Szöktetés, előbb a felső lap (a szingli figura ellen; ha az átmenetek engedik)"
  # A szerkesztő: „ha szingli K üti a D-t … az Ász lehívásával és utána D szöktetés”.
  felulir:
    alkalmazhato: ["nem_adu(SZ)", "van(F)", "van(V)", "hossz(felettunk_kezben(VK, SZ, F)) == 0",
                   "hossz(FELETTE) >= 1", "kezhossz(HK, SZ) >= 2", "kezhossz(VK, SZ) >= 2"]
    korok:
      - {fajta: lehiv, lap: "elso(FELETTE)"}
      - {fajta: impassz, hivo: HK, lap: V}
      - {ismetles: "hossz(FELETTE) - 1", fajta: lehiv, lap: "tobbi(FELETTE)", begyujtes: igen}
    siker: "birtokos(F) == bal(HK) or figura_hossz(F) == 1"

- technika: VESZTOCSERE
  nev: "Vesztőcsere: a másik kéz többletnyerőire vesztőt dobunk"
  # Játékmód: VESZTOCSERE (jatekmodok.yaml). Az egyik kéz nyerői a színben több,
  # mint ahány lapja a partnernek van: a többletre a partner a többi színből dob
  # (MB 4♠: az asztal ♥AK-ja, Kelet kőrből színhiányos). Kockázat: a védő lophat, ha
  # színhiányos és van adója (az ELLOPÁS általános szabály) — ezért a kiaduzás
  # után a legbiztosabb, ha az átmenetek engedik.
  # Minta: szingli ász az egyik kézben, király-hosszú szín a másikban (forrás: BM A-2 #1,
  # 2026-11-19) — a két kéz nyerői együtt számítanak; előbb a rövid kéz nyerője (deblokk), aztán a hosszú kézé, amelyre a rövid
  # kéz dob. A dobások száma: a nyert körök − a rövid kéz hossza.
  szerepek:
    DK: "rovidebb_kez(SZ)"
    NYK: "partner(DK)"
    NYERO: "nyerok_rovid_elobb(SZ)"
    TOBBLET: "min(hossz(NYERO), max(kezhossz(DK, SZ), kezhossz(NYK, SZ))) - kezhossz(DK, SZ)"
  alkalmazhato: ["nem_adu(SZ)", "van(DK)", "TOBBLET >= 1",
                 "hossz(nyerok_kezben(NYK, SZ)) >= TOBBLET"]
  korok:
    - {ismetles: "hossz(NYERO)", fajta: lehiv, lap: NYERO}
  siker: "True"
  kudarc_koltseg: 0
  hozam: "TOBBLET"
  hasznal: [NYERO]
  elfogyaszt: [NYERO]

- technika: LOPAS_ROVID_KIADASSAL
  nev: "Lopás a rövid adus kézben, kiadás után: előbb egy kört átengedünk, hogy a rövid kéz kiürüljön"
  # MB 4♠: ♣AKJ2 / ♣543 — az A, K után egy treffet kiadunk, a negyediket az asztal
  # lopja. A LOPAS_ROVID_KEZBEN párja, ha a felső lapjaink nem elegendők a rövid kéz
  # kiürítéséhez.
  szerepek:
    F: "legnagyobb_kint(SZ)"
    L: "rovid_adu_lopo(SZ)"
    MK: "partner(L)"
    N: "kezhossz(L, SZ)"
    NYERO: "felettunk(SZ, F)"
    KIAD: "N - hossz(NYERO)"
    # a kiadás után a védő aduval válaszolhat: a lopó kéz aduiból annyival kevesebb
    # marad (a szerkesztő, 2026-11-20: „hány százalék az ismételt kőrhívás?” — az
    # optimális védő mindig visszahív, ha van adója)
    R: "min(kezhossz(MK, SZ) - N, adu_szabad(L) - aduvisszahivas(KIAD), max(1, hiany()))"
  alkalmazhato: ["nem_adu(SZ)", "van(L)", "KIAD >= 1", "KIAD <= 1", "R >= 1"]
  korok:
    - {ismetles: "hossz(NYERO)", fajta: lehiv, lap: NYERO}
    - {ismetles: "KIAD", fajta: kiad, hivo: MK}
    - {ismetles: "R", fajta: lop, hivo: MK, lopo: L}
  # A szerkesztő (2026-11-18): ha a védők lapjai a rövid kéz köreire elfogynak, a
  # hosszú kéz lapja magas — a lopás nem hoz semmit. Csak akkor ér, ha a védők hosszabb
  # fele hosszabb a rövid kéznél. Ára: a rövid kéz aduit félre kell tenni (nem lehet
  # kiaduzni), és a kiadás után a védők aduval vághatnak.
  siker: "max_vedo_hossz(SZ) > N"
  kudarc_koltseg: 0
  hozam: "R"
  hasznal: [NYERO]
  elfogyaszt: [NYERO]

- technika: LOPAS_ROVID_KIENGEDESSEL
  nev: "Lopás a rövid kézben, kiengedéssel: a rövid kéz saját nyerői és kiengedett körök után lop; a hosszú kéz felső lapja a végére marad"
  # A szerkesztő elve (6♦, 2026-11-03): csak annyit kell lehívni, ami után a szín
  # lopható. Minta (forrás: BM A-2 #1, 2026-11-19): Axxxx / Kx — a király, aztán egy
  # kis lap kiengedve („mindegy, hogy ütik vagy lopják”), utána a rövid kéz lop; az ász
  # a kiaduzás után. Ha az ászt előbb hívjuk, a rövid védő ellophatja.
  szerepek:
    F: "legnagyobb_kint(SZ)"
    L: "rovid_adu_lopo(SZ)"
    MK: "partner(L)"
    N: "kezhossz(L, SZ)"
    NYL: "felettunk_kezben(L, SZ, F)"
    FMK: "felettunk_kezben(MK, SZ, F)"
    KIAD: "N - hossz(NYL)"
    R: "min(kezhossz(MK, SZ) - N - hossz(FMK), adu_szabad(L) - aduvisszahivas(KIAD), max(1, hiany()))"
  alkalmazhato: ["nem_adu(SZ)", "van(L)", "KIAD >= 1", "KIAD <= 2", "R >= 1", "hossz(FMK) >= 1"]
  korok:
    - {ismetles: "hossz(NYL)", fajta: lehiv, lap: NYL}
    - {ismetles: "KIAD", fajta: kiad, hivo: MK}
    - {ismetles: "R", fajta: lop, hivo: MK, lopo: L}
    # az FMK (a hosszú kéz felső lapja) itt nem kör: a kiaduzás utáni begyűjtésben
    # megy le, hogy a védő ne lophassa el
  siker: "True"
  kudarc_koltseg: 0
  hozam: "R"
  hasznal: [NYL, FMK]
  elfogyaszt: [NYL]

- technika: BEDOBAS
  nev: "Elimináció és bedobás: a többi mellékszín eltüntetése után szándékosan kiadott ütés; a védő kényszerből hív"
  # A szerkesztő (2026-11-21; forrás: BM A-6 #1). Adus felvételben, tipikusan tükörlapnál
  # (a mellékszínek a két kézben egyforma hosszúak — sem rövid kezes lopás, sem
  # asztalfordítás nincs). Lépések:
  #   1. kiaduzás (a fázis: utána), mindkét kezünkben marad adu;
  #   2. elimináció: a tükörszínek nyerőinek lehívása, a szín mindkét kezünkből elfogy;
  #   3. a bedobó színben (SZ) a nyerők lehívása, aztán a kiadás — utána SZ is elfogy;
  #   4. a védő kényszerhívása: eliminált szín → dob-lop (az egyik kéz lop, a másik
  #      vesztőt dob); a kényszerszín (K) → impasszba hív, vagy fagyott színt bont.
  # Minta: Axx / Kxx tükörszín; AQ / xx bedobó szín (az ász, aztán a dáma kiadva);
  # A98 / KJ10 kétirányú villa (a kényszerszín).
  szerepek:
    ELIM: "eliminalo_lapok(SZ)"
    K: "kenyszer_szinek(SZ)"
    KIAD: "bedobo_kiad(SZ)"
    NY: "felettunk(SZ, legnagyobb_kint(SZ))"
    # a lopással eliminálandó színek: a tervben egy lopó egységnek (pl. asztalfordítás)
    # kell előtte eltüntetnie őket (BM A-6 #2)
    LOPVA: "lopva_eliminalando(SZ)"
    # az aduszín a kiadó szín: a bedobás borulása (4-1) felismerhető — csak ilyenkor
    # kaphat tartalékot a kényszerszín (BEDOBAS_TARTALEK)
    ADUKIAD: "not nem_adu(SZ)"
  # Az aduszín is lehet bedobó szín (BM A-6 #3): a kiaduzás a felső adukkal megáll, a
  # kint maradt egyetlen nagyobb adut az elimináció után adjuk ki.
  alkalmazhato: ["van(adu())", "KIAD >= 1", "KIAD <= 2", "hossz(K) >= 1",
                 "ha(nem_adu(SZ), adu_marad(), KIAD == 1 and min_adu() >= hossz(NY) + KIAD + 1)"]
  korok:
    - {ismetles: "hossz(ELIM)", fajta: lehiv, lap: ELIM}
    - {ismetles: "hossz(NY)", fajta: lehiv, lap: NY}
    - {ismetles: "KIAD", fajta: kiad}
  siker: "True"
  kudarc_koltseg: 0
  hozam: 1
  hasznal: [ELIM, NY]
  elfogyaszt: [ELIM, NY]

- technika: ASZTALFORDITAS
  nev: "Asztalfordítás (dummy reverse): a hosszabb adus kéz lop annyiszor, hogy ő legyen a rövidebb"
  # A szerkesztő (2026-11-21; forrás: BM A-6 #2). A hosszabb adus kéz (L) egy színben
  # rövid; a partnere (M) nyerőire követ (vagy dob), aztán M maradék lapjait L lopja.
  # Ha L legalább (L adui − M adui + 1)-szer lop, a rövidebb lesz: a kiaduzást M aduival
  # fejezzük be, és a „rövid aduból lopás” igazzá válik. Feltétele, hogy M adui is
  # elegendők a kiaduzáshoz. A fő kéz így M: minden lopás egy M-vesztőt tüntet el.
  # Minta: Axxxx adu / ♣x szingli a hosszú adus kézben; Kxxx adu / ♣AKxx az asztalon.
  # A szerkesztő (12:07): a lopáshoz csak annyi magas lapot hívunk, amennyi L kiürítéséhez
  # kell; a többi nyerőt (és rá a dobást) a kiaduzás egy-két köre után, az utolsó lopás
  # előtt hívjuk — amíg az asztalon vagyunk, de már nem lophatják el (felüllopás,
  # ellopás kockázata a legkisebb).
  szerepek:
    L: "hosszu_adus_kez()"
    M: "partner(L)"
    NYERO: "nyerok_kezben(M, SZ)"
    NYK: "elejen(NYERO, kezhossz_k(L, SZ))"
    NYU: "kihagy(NYERO, kezhossz_k(L, SZ))"
    R: "kezhossz(M, SZ) - hossz(NYERO)"
  alkalmazhato: ["nem_adu(SZ)", "van(L)", "kezhossz(L, SZ) <= hossz(NYERO)", "R >= 1",
                 "R >= adu_kezben(L) - adu_kezben(M) + 1", "adu_kezben(L) >= R + 1",
                 "adu_kezben(M) >= kint_db(adu()) - 1"]
  korok:
    - {ismetles: "hossz(NYK)", fajta: lehiv, lap: NYK}
    - {ismetles: "R - 1", fajta: lop, hivo: M, lopo: L}
    - {ismetles: "hossz(NYU)", fajta: lehiv, lap: NYU}
    - {ismetles: "1", fajta: lop, hivo: M, lopo: L}
  siker: "True"
  kudarc_koltseg: 0
  hozam: "R"
  hasznal: [NYERO]
  elfogyaszt: [NYERO]

- technika: BEDOBAS_IMPASSZ
  nev: "Impassz bedobással: elimináció után az impassz — ha nem sikerül, az ütő védő kényszerből hív"
  # A szerkesztő (2026-11-21; forrás: BM A-6 #3). A többi mellékszín eliminálása után
  # az impassz maga a bedobás: ha sikerül, megvan a plusz ütés; ha nem, a negyedik kéz
  # védője üt, és kénytelen dob-lopot adni vagy a kényszerszínt (pl. kétirányú villa)
  # meghívni. Az aduszínben is: AJxx / KTxx — a K lehívása, a mellékszínek
  # eliminálása, aztán az adu-impassz; a védő a D-vel bedobva. Ilyenkor az egység a
  # kiaduzás előtt jár (a kiaduzás nem ütheti ki idő előtt a hiányzó figurát).
  szerepek:
    F: "legnagyobb_kint(SZ)"
    V: "kozvetlen_alatta(SZ, F)"
    VK: "keze(V)"
    HK: "partner(VK)"
    FELETTE: "felettunk_kezben(VK, SZ, F)"
    DEBLOKK: "ha(kezhossz(HK, SZ) <= kezhossz(VK, SZ), felettunk_kezben(HK, SZ, F), [])"
    ELIM: "eliminalo_lapok(SZ)"
    K: "kenyszer_szinek(SZ)"
    LOPVA: "lopva_eliminalando(SZ)"
    ADUSZIN: "adu()"
  alkalmazhato: ["van(adu())", "van(F)", "van(V)", "hossz(FELETTE) >= 1",
                 "kezhossz(HK, SZ) > hossz(DEBLOKK)",
                 "kezhossz(VK, SZ) > hossz(FELETTE) + hossz(DEBLOKK) or hossz(DEBLOKK) == 0",
                 "hossz(K) >= 1", "hossz(LOPVA) == 0",
                 "ha(nem_adu(SZ), adu_marad(), min(adu_kezben(VK), adu_kezben(HK)) >= hossz(DEBLOKK) + 2)"]
  korok:
    - {ismetles: "hossz(DEBLOKK)", fajta: lehiv, lap: DEBLOKK}
    - {ismetles: "hossz(ELIM)", fajta: lehiv, lap: ELIM}
    - {fajta: impassz, hivo: HK, lap: V}
    - {ismetles: "hossz(FELETTE)", fajta: lehiv, lap: FELETTE, begyujtes: igen}
  siker: "True"
  kudarc_koltseg: 0
  hozam: 1
  hasznal: ["[V]", FELETTE, DEBLOKK, ELIM]
  elfogyaszt: ["[V]", FELETTE, DEBLOKK, ELIM]

# --- Hozzátevési sémák: a védő hívására tett lapjaink ----------------------------------
#
# A `fajta: hozzatevesi` séma nem kör-kotta, hanem döntés a folyó ütésre: a védő hívott,
# és a mi (még nem tett) KÉT kezünk lapja a terv része (a szerkesztő, 2026-11-22: „a
# játékterv a két kézre együtt készül”). A tervező a séma döntésével és nélküle is
# lefuttatja a jelölt terveket ugyanazokon a világokon; a jobb marad (strategiak.yaml,
# HIVASRA_TETT_LAP). A mezők:
#   szerepek, alkalmazhato  mint a kottánál (a `hivott_lap(SZ)` csak védő hívásánál él)
#   hozzatetel              mit tesz a még nem tett kezünk: `kicsi` = a színből a
#                           legkisebb lapja (nem ütünk)
#   rovid                   a terv nevében ez áll (pl. „♠ Bath-csel”)
#   megtart                 a lapjaink, amelyeket a terv ezután is megtart (nem átmenet,
#                           nem dobás): a Bath-csel után a szín fogásai

- technika: BATH
  fajta: hozzatevesi
  nev: "Bath-csel: kiengedés a védő figurájára, ha a sorozata fölötti és alatti lap nálunk van"
  rovid: "Bath-csel"
  # (a szerkesztő, 2026-11-22) Nyugat a ♠K-val indul (KD-ból), nálunk ♠ÁB4 / ♠75: nem
  # ütünk. Nyugat a színt nem folytathatja ütésvesztés nélkül (a ♠D-re Á, és a ♠B magas;
  # kicsire a ♠B üt), Keletnek pedig eggyel kevesebb pikkje marad. A tervező példája:
  # claude/sematar-naplo-cselek.md (3NT, ♠4: 11 ütés, ♠Á: bukás). Hogy a K valóban
  # KD-ból jön-e, azt nem a séma dönti el: a világok az indítási megállapodás szerintiek
  # (ELLENFEL_INDITASA), a szingli K-s és Kx-es világokban a kiengedés ütést veszít —
  # a szimuláció ezt is mérlegeli.
  szerepek:
    H: "hivott_lap(SZ)"                # a védő hívott figurája (♠K)
    D: "kint_kozvetlen_alatta(SZ, H)"  # a sorozata feltételezett párja (♠D), kint
    FELSO: "kozvetlen_felette(SZ, H)"  # a lapunk közvetlenül fölötte (♠Á)
    ALSO: "kozvetlen_alatta(SZ, D)"    # a lapunk közvetlenül D alatt (♠B)
  alkalmazhato: ["nem_adu(SZ)", "van(H)", "van(D)", "van(FELSO)", "van(ALSO)"]
  hozzatetel: kicsi
  # (a fogások megtartása — hogy az Á ne legyen átmenet a kézbe, amíg a tervezett ütések
  # nincsenek meg — általános szabály: FOGAS_VEDES, strategiak.yaml)
  siker: "True"
  hozam: 0
