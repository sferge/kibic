# MOHA_INFO_KONTRA — az információs kontra a Moha-kör szerint (2026-10-21).
#
# A KIBIC_STAND általános INFORMATIV_KONTRA-ját írja felül a MOHA_STAND-on
# (azonos kulcs: a kontra mintája; a MOHA_STAND a KIBIC_STAND ELŐTT hivatkozza).
# SZÁNDÉKOSAN nincs `tema:`-ja: a téma-foglalás az egész INFORMATIV_KONTRA-t
# kiváltaná (a válaszokat is) — itt csak a kontra sorait írjuk felül.
# A szerkesztő (2026-10-21): „a (közvetlen) közbeszólásra is érvényesek az
# indulási elvek — beleértve a FELMENTÉST is”; „a 20+ biztosan rossz”; a
# KIBIC-ben maradjon a 17+, a Mohában 18+.
#
#   alakos kontra   induló erő, legfeljebb 17 pont: 13-17, vagy 11-12, ha a lap
#                   induló erős (legfeljebb 7 vesztő, nem rossz lap, üres figurával a
#                   korrigált pont 13+ — a FELMENTÉS fordítva); újranyitóként 9-17,
#                   2-es szinten 13-17, 3-ason 14-17
#   minor kontrája  az ő minorjuk legfeljebb 3 lap, a nemesekben legalább 4-3
#                   (a szerkesztő, 2026-10-21: „kontra = minimum 4-3 a nemesekben”)
#   nemes kontrája  az ő színük legfeljebb 2 lap, a többiben 3+
#   erős kontra     18+, bármilyen elosztás (utána a saját szín: erős lap);
#                   az egyenletes 16-19 fogással 1NT marad (prioritás 57 < 58)
#   felmentés       (licit-szál, 2026-10-21) minor ellen 9-11 ponttal is, 8-9
#                   nemes lappal, a színükben legfeljebb 2 lap, 2+ kontroll
rendszer:
  kod: MOHA_INFO_KONTRA
  nev: Információs kontra (Moha)
  nev_en: Takeout Double (Moha)
  fajta: KONVENCIO
  leiras: "Induló erő (a FELMENTÉS szerint) legfeljebb 17 ponttal, rövidség a színükben, minor ellen legalább 4-3 a nemesekben, nemes ellen 3+ a többiben; vagy 18+ bármilyen lap."
  jegyzet: >-
    A közbeszólásra az indulási elvek érvényesek: 11-12 ponttal csak induló
    erős lappal (legfeljebb 7 vesztő, nem rossz lap). A felső határ 17: 18
    ponttól az erős kontra él, bármilyen elosztással.
