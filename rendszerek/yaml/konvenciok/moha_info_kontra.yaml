      - {minta: "(1C) X", pont: "11-12", hossz: {"C": "0-3"}, vagy: [{"hossz": {"H": "4+", "S": "3+"}}, {"hossz": {"S": "4+", "H": "3+"}}], vesztok: "0-7", minoseg: nem_rossz,
         feltetel: {t: VAGY, gy: [{t: OSSZE, op: "<=", bal: {t: URES_FIGURA}, jobb: {t: SZAM, v: 0}},
                                {t: OSSZE, op: ">=", bal: {t: KORR_PONT, levonas: 0.5}, jobb: {t: SZAM, v: 13}}]},
         forsz: "EGY_MENET", elvaras: "VALASSZ", prioritas: 53,
