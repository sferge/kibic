# MOHA_KOZBESZOLAS — a még nem passzolt kéz első megszólalása az ellenfél
# nyitására (a szerkesztő, 2026-11-11). A passzolt kézre a KIBIC-szabályok
# maradnak (a sorok `ha: {ules: [2, 3, 4]}` feltétellel csak a saját
# helyzetükben írják felül a KIBICEGY_KUZDELMI / GYENGE_UGRO_KOZBESZOLAS sorait).
