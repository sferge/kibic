#     induló erős lappal: legfeljebb 7 vesztő, nem rossz lap), 5+ lap;
#   * a 2-es szinten szintenként +1,5 pont: 14-17, vagy 12-13 legfeljebb 6
#     vesztővel, nem rossz lappal;
#   * gyenge ugró közbeszólás: mint passz után, de 1-2 védekező ütéssel
#     (ász vagy KD — gyorsütés 1-2);
#   * a szan-közbeszólás közvetlenül 16-19 (a KIBICEGY_KUZDELMI-ben is ez).
