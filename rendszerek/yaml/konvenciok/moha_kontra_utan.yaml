# MOHA_KONTRA_UTAN — a kontra nem változtat a licitek jelentésén (system on;
# a szerkesztő, 2026-11-12, #7). A MOHA rendszerekben a KIBICEGY_KUZDELMI
# „Információs kontra a nyitásunkra” fejezetének megfelelő sorai helyett.
#   * új szín az 1-es szinten: 4+ lap, 6+ (mint kontra nélkül) — 1♥ (X) 1♠
#     4 pikkel, a káró hosszától függetlenül;
#   * 1M (X) 1NT: 6-10(11), nem kényszerít, de FOGÁST ígér a nem licitált
#     nemesben; fogás nélkül 8+ ponttal rekontra, 6-7 ponttal passz;
#   * passzolt lappal a Drury kontra után is él (2♣ 3 lapos, 2♦ 4+ lapos adu);
#   * közbeszólás (2m) után: nem passzolt laptól a kontra negatív (8+, nem ígér
#     nemes támogatást); passzolt laptól Drury (invit erő, támogatás: a (2♣)
#     után 3, a (2♦) után 4+ lap).
rendszer:
  kod: MOHA_KONTRA_UTAN
  nev: Kontra a nyitásunkra (Moha, system on)
  nev_en: After their double (Moha, system on)
  fajta: KONVENCIO
  leiras: "A kontra után a licitek megtartják jelentésüket: új szín 4+ 6+, 1NT fogással a nem licitált nemesben (különben XX 8+ / passz 6-7), passzolt lappal Drury; (2m) után a kontra nem passzolt laptól negatív, passzolt laptól Drury."
fejezetek:
  - fejezet: "Az információs kontra után"
    szabalyok:
      - {minta: "1C (X) 1D", pont: "6+", hossz: {D: 4+}, forsz: EGY_MENET, prioritas: 55, magyarazat: "Új szín: 4+ káró, 6+ (a kontra nem változtat)"}
      - {minta: "1C (X) 1H", pont: "6+", hossz: {H: 4+}, forsz: EGY_MENET, prioritas: 56, magyarazat: "Új szín: 4+ kőr, 6+ (a kontra nem változtat)"}
      - {minta: "1C (X) 1S", pont: "6+", hossz: {S: 4+}, forsz: EGY_MENET, prioritas: 57, magyarazat: "Új szín: 4+ pikk, 6+ (a kontra nem változtat)"}
      - {minta: "1D (X) 1H", pont: "6+", hossz: {H: 4+}, forsz: EGY_MENET, prioritas: 56, magyarazat: "Új szín: 4+ kőr, 6+ (a kontra nem változtat)"}
      - {minta: "1D (X) 1S", pont: "6+", hossz: {S: 4+}, forsz: EGY_MENET, prioritas: 57, magyarazat: "Új szín: 4+ pikk, 6+ (a kontra nem változtat)"}
      - {minta: "1H (X) 1S", pont: "6+", hossz: {S: 4+}, forsz: EGY_MENET, prioritas: 57, magyarazat: "Új szín: 4+ pikk, 6+ (a kontra nem változtat)"}
      - {minta: "1H (X) 1NT", pont: "6-11", hossz: {H: 0-2}, fogas: ["S"], forsz: NEM, prioritas: 53, magyarazat: "6-10(11), nem kényszerít; fogás pikkban"}
      - {minta: "1H (X) XX", kulcs: "1H-X-XX-FOGASNELKUL", pont: "8-11", hossz: {H: 0-2, S: 0-3}, prioritas: 52, alert: "Rekontra: 8+, nincs fogás pikkban (az 1NT helyett)"}
      - {minta: "1H (X) P", kulcs: "1H-X-P-6-7", pont: "6-7", hossz: {H: 0-2, S: 0-3}, prioritas: 51, magyarazat: "6-7, nincs fogás pikkban: passz"}
      - {minta: "1H (X) 2C", kulcs: "1H-X-DRURY-3", ha: {passzolt: igen}, pont: 10-12, hossz: {H: 3}, forsz: EGY_MENET, prioritas: 60, alert: "Drury (kontra után is): 10-12, 3 lapos adu"}
      - {minta: "1H (X) 2D", kulcs: "1H-X-DRURY-4", ha: {passzolt: igen}, pont: 10-12, hossz: {H: 4+}, forsz: EGY_MENET, prioritas: 60, alert: "Drury (kontra után is): 10-12, 4+ lapos adu"}
      - {minta: "1S (X) 1NT", pont: "6-11", hossz: {S: 0-2}, fogas: ["H"], forsz: NEM, prioritas: 53, magyarazat: "6-10(11), nem kényszerít; fogás kőrban"}
      - {minta: "1S (X) XX", kulcs: "1S-X-XX-FOGASNELKUL", pont: "8-11", hossz: {S: 0-2, H: 0-3}, prioritas: 52, alert: "Rekontra: 8+, nincs fogás kőrban (az 1NT helyett)"}
      - {minta: "1S (X) P", kulcs: "1S-X-P-6-7", pont: "6-7", hossz: {S: 0-2, H: 0-3}, prioritas: 51, magyarazat: "6-7, nincs fogás kőrban: passz"}
      - {minta: "1S (X) 2C", kulcs: "1S-X-DRURY-3", ha: {passzolt: igen}, pont: 10-12, hossz: {S: 3}, forsz: EGY_MENET, prioritas: 60, alert: "Drury (kontra után is): 10-12, 3 lapos adu"}
      - {minta: "1S (X) 2D", kulcs: "1S-X-DRURY-4", ha: {passzolt: igen}, pont: 10-12, hossz: {S: 4+}, forsz: EGY_MENET, prioritas: 60, alert: "Drury (kontra után is): 10-12, 4+ lapos adu"}
  - fejezet: "Kontra a minor közbeszólás után: (1M) (2m) X"
    szabalyok:
      - {minta: "1H (2C) X", kulcs: "1H-2C-X-DRURY", ha: {passzolt: igen}, pont: 10-12, hossz: {H: 3}, forsz: EGY_MENET, prioritas: 60, alert: "Drury kontrával: 10-12, 3 lapos adu"}
      - {minta: "1H (2C) X", kulcs: "1H-2C-X-NEGATIV", ha: {passzolt: nem}, pont: 8+, prioritas: 55, alert: "Negatív kontra: 8+, nem ígér kőr támogatást"}
      - {minta: "1H (2D) X", kulcs: "1H-2D-X-DRURY", ha: {passzolt: igen}, pont: 10-12, hossz: {H: 4+}, forsz: EGY_MENET, prioritas: 60, alert: "Drury kontrával: 10-12, 4+ lapos adu"}
      - {minta: "1H (2D) X", kulcs: "1H-2D-X-NEGATIV", ha: {passzolt: nem}, pont: 8+, prioritas: 55, alert: "Negatív kontra: 8+, nem ígér kőr támogatást"}
      - {minta: "1S (2C) X", kulcs: "1S-2C-X-DRURY", ha: {passzolt: igen}, pont: 10-12, hossz: {S: 3}, forsz: EGY_MENET, prioritas: 60, alert: "Drury kontrával: 10-12, 3 lapos adu"}
      - {minta: "1S (2C) X", kulcs: "1S-2C-X-NEGATIV", ha: {passzolt: nem}, pont: 8+, prioritas: 55, alert: "Negatív kontra: 8+, nem ígér pikk támogatást"}
      - {minta: "1S (2D) X", kulcs: "1S-2D-X-DRURY", ha: {passzolt: igen}, pont: 10-12, hossz: {S: 4+}, forsz: EGY_MENET, prioritas: 60, alert: "Drury kontrával: 10-12, 4+ lapos adu"}
      - {minta: "1S (2D) X", kulcs: "1S-2D-X-NEGATIV", ha: {passzolt: nem}, pont: 8+, prioritas: 55, alert: "Negatív kontra: 8+, nem ígér pikk támogatást"}
