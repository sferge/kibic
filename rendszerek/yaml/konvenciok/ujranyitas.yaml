      közbeszólás színében (0-2 lap), 12+ FP — a partner büntető passza
      (rejtett negatív kontra helyett) ezzel kijöhet; vagy többleterő
      (18+, a KIBIC_STAND-on 17+), bármilyen elosztással.
    szabalyok:
      - {minta: "1C (1D) P (P) X", pont: 12+, hossz: {D: 0-2}, forsz: EGY_MENET, prioritas: 53, alert: "Újranyitó kontra: rövid káró, a partner büntetőre passzolhat"}
