      A partner már passzolt (legfeljebb ~11): 0-7 a legolcsóbb szín; 8+
      ugrás vagy szan; felüllicit maximális passzolt lappal (10-11)
      rövidséggel a színükben; büntető passz erős aduval (mérlegelés).
