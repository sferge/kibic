# UJRANYITAS — újranyitás a sor végén: (Nx) P (P) ?  (a szerkesztő, 2026-11-11)
#
# Az ellenfél N-es szintű nyitása után két passz: még nem licitáltunk.
# (A közvetlen helyzet — (Nx) ? — az INFORMATIV_KONTRA / MOHA_INFO_KONTRA.)
#
#   * 18+ (a KIBIC_STAND-on 17+, paraméter: ERO_KONTRA_MIN): kontra,
#     bármilyen elosztással, minden szinten;
#   * saját szín nyitóerővel: színbemondás; egyenletes lap: „gyengített” szan;
#   * a nyitóerő közelében a határ N-től függ — N=1-nél a 3./4. helyi
#     nyitás szerint (minorra a két nemesben 7+ lap, 4-3; nemesre 4+ a
#     másik nemesben); N>1-nél nő, ha a kontrára várható válasz N+1 szintre
#     kényszerít.
#
#                        N=1              N=2                    N=3
#   kontra (rövidség)    9+               11+ (3-as válasz: 12+)  13+
#   szan                 1NT 14-17        2NT 15-18               3NT 16-19
#   szín az N. szinten   8+, 5+ lap       10+, 5+ lap             13+, 6+ lap
#   szín az N+1. szinten 10+, 5+ lap      12+, 6+ lap             13+, 6+ lap
rendszer:
  kod: UJRANYITAS
  nev: Újranyitás a sor végén
  nev_en: Balancing
  fajta: KONVENCIO
  leiras: "(Nx) P (P) után: kontra rövidséggel (N=1: 9+, N=2: 11-12+, N=3: 13+) vagy erővel (18+ / 17+); gyengített szan (1NT 14-17, 2NT 15-18, 3NT 16-19); színbemondás."
fejezetek:
  - fejezet: "Kontra a sor végén"
    szabalyok:
      - {minta: "(1C) P (P) X", pont: "9+", hossz: {C: 0-3}, vagy: [{hossz: {H: 4+, S: 3+}}, {hossz: {S: 4+, H: 3+}}], forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid treff, a nemesekben 7+ lap (4-3)"}
      - {minta: "(1D) P (P) X", pont: "9+", hossz: {D: 0-3}, vagy: [{hossz: {H: 4+, S: 3+}}, {hossz: {S: 4+, H: 3+}}], forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid káró, a nemesekben 7+ lap (4-3)"}
      - {minta: "(1H) P (P) X", pont: "9+", hossz: {H: 0-2, S: 4+}, forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid kőr, 4+ pikk"}
      - {minta: "(1S) P (P) X", pont: "9+", hossz: {S: 0-2, H: 4+}, forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid pikk, 4+ kőr"}
      - {minta: "(2D) P (P) X", pont: "11+", hossz: {D: 0-2}, vagy: [{hossz: {H: 4+, S: 3+}}, {hossz: {S: 4+, H: 3+}}], forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid káró, a nemesekben 7+ lap (4-3)"}
      - {minta: "(2H) P (P) X", pont: "11+", hossz: {H: 0-2, S: 4+}, forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid kőr, 4+ pikk"}
      - {minta: "(2H) P (P) X", pont: "12+", hossz: {H: 0-2, S: 3, C: 3+, D: 3+}, forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid kőr, támogatás a többiben (a válasz a 3-as szinten)"}
