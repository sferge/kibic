      - {minta: "(1D) P (P) X", ha: {ules: 4}, pont: "9+", hossz: {D: 0-3}, vagy: [{hossz: {H: 4+, S: 3+}}, {hossz: {S: 4+, H: 3+}}], forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 53, alert: "Újranyitó kontra: rövid káró, a nemesekben 7+ lap (4-3)"}
