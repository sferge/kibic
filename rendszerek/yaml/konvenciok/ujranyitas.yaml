# UJRANYITAS — újranyitás a sor végén (a szerkesztő, 2026-11-11)
#
# 1) (Nx) P (P) ?  — az ellenfél N-es nyitása után két passz, még NEM
#    licitáltunk (a 4. kézben ülünk, ules 4). A közvetlen helyzet — (Nx) ? —
#    az INFORMATIV_KONTRA / MOHA_INFO_KONTRA.
#
#                        N=1              N=2                    N=3
#   kontra (rövidség)    9+               11+ (3-as válasz: 12+)  13+
#   erős kontra          18+ (KIBIC_STAND: 17+; ERO_KONTRA_MIN), bármilyen elosztás
#   szan                 1NT 14-17        2NT 15-18               3NT 16-19
#   szín az N. szinten   8+, 5+ lap       10+, 5+ lap             13+, 6+ lap
#   szín az N+1. szinten 10+, 5+ lap      12+, 6+ lap             13+, 6+ lap
#
# 2) (P) P (Nx) P (P) ?  — MI MÁR PASSZOLTUNK (ules 1-3), és a partner az
#    indító után ülve tudva passzolt, hogy nincs nyitóerőnk: szinte soha nem
#    nyitunk újra — csak minor nyitás után 9+ lappal a két nemesben (kontra),
#    vagy 11+ ponttal szan reményében (1NT 11-14).
#
# 3) A NYITÓ újranyitása: 1x (y) P (P) ?  — kontra rövidséggel (12+) vagy
#    erővel (18-19); 2NT 18-20 fogással a színükben; felüllicit 20+.
#    A partner: fogással és együtt gémerővel büntető passz vagy 3NT (a
#    mérlegelés dönt); különben a legolcsóbb szín.
#
# 4) A partner az újranyitás után (ő már passzolt: legfeljebb ~11 pont):
#    a kontrára 0-7 a legolcsóbb szín; 8+ ugrás vagy szan (N=1: 1NT 8-10,
#    2NT 11-12, 3NT 13+; N=2: 2NT 8-11, 3NT 12+; N=3: 3NT 9+); felüllicit:
#    maximális passzolt lap (10-11) rövidséggel a színükben; büntető passz
#    erős aduval (mérlegelés). Fogással az ellenfél színében SZAN (a
#    színbemondásra is).
#    A kontrázó a legolcsóbb színre 4 lapos fittel: 12-14 passz, 15-17
#    emelés, 18+ ugró emelés.
rendszer:
  kod: UJRANYITAS
  nev: Újranyitás a sor végén
  nev_en: Balancing
  fajta: KONVENCIO
  leiras: "(Nx) P (P) után: kontra rövidséggel vagy erővel, gyengített szan, színbemondás; passzolt lappal csak kivételesen; a nyitó újranyitása (kontra, 2NT fogással, felüllicit); a partner válaszai (0-7 legolcsóbb, 8+ ugrás vagy szan, fogással szan, büntető passz)."
