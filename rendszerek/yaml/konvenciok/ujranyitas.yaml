      - {minta: "(1C) P (P) X (P) P", kulcs: "UJRA-X-BUNTETO-1C", prioritas: 60, dontesi_mod: MERLEGELO, hossz: {C: 4+}, vagy: [{fohonor: {C: 2+}}, {hossz: {C: 5+}, fohonor: {C: 1+}}], magyarazat: "Büntető passz: erős aduk a színükben"}
