      - {minta: "(1C) P (P) X", kulcs: "UJRANYITO-ERO-1C", pont: {param: ERO_KONTRA_MIN, alap: 17}, forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 57, alert: "Újranyitó kontra: erős lap, bármilyen elosztás"}
