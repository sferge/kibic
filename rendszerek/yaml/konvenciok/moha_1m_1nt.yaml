# MOHA_1M_1NT — az 1M-1NT folytatásai a Moha-kör szerint (a szerkesztő,
# 2026-11-13, MB őszi kupa 9/4). Generálva: scratchpad gen/m1nt.py.
#
#   1M-1NT        kvázi kényszerítő (alert), az 1./2. kézbeli nyitásra is;
#                 passzos partnertől nem kényszerít, legfeljebb 10 FP.
#                 A nyitó minimummal (14, rossz 15) és egyenletes lappal passzolhat.
#   1M-1NT-2x     (x alacsonyabb, mint M): nem többleterő, csak egyenetlen,
#                 kétszínű lap.
#   1M-1NT-2x-?   ugrás nélküli saját szín: nem invit (6+ lap, gyenge);
#                 2M: leállás (2 lap, vagy 3 lap legfeljebb 1 fedőütéssel —
#                 az 1M-2M kettőt ígér); 2NT és az x emelése: invit.
#                 (Az 1M-1NT-2x-3M nincs: ellentmondana az 1M-2M-nek.)
#   1M-1NT-2x-2M-3M  invit 6 lapos M-mel, (15)16 FP, 5 vesztő; a partner 2
#                 fedőütéssel (ász, király, DB) gémet mond. 4 vesztővel a nyitó
#                 egyenesen 4M.
rendszer:
  kod: MOHA_1M_1NT
