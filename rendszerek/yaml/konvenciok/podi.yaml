rendszer:
  kod: PODI
  nev: PODI-PORI
  nev_en: PODI-PORI
  fajta: KONVENCIO
  leiras: "Lépcsős válasz / relé közbeszólás után: 1. lépcső passz, 2. lépcső kontra (rekontra), 3. lépcsőtől az első szabad licit. Relénél: passz = relé, kontra = büntető."
fejezetek:
