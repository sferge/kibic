            t: PARAM
            kod: FESU_GYENGE_MAX
            alap: 8
        - t: OSSZE
          op: '>='
          bal:
            t: ERT
            kod: HCP
          jobb:
            t: PARAM
            kod: FESU_GF_MIN
            alap: 13
    jelentes:
