  - minta: .. (*) X
    kulcs: FESU_X
    prioritas: 30
    dontesi_mod: MERLEGELO
    ha:
      nyers:
        t: ES
        gy:
        - t: ISMERT_SZINEK
          ki: ok
          db: 2
        - t: NYILATKOZOTT
          ki: p
        - t: NEM
          gy:
          - t: FIT
            szin: '@V1'
            min: 8
        - t: NEM
          gy:
          - t: FIT
            szin: '@V2'
            min: 8
