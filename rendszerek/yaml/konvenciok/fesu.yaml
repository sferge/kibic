    forsz: EGY_MENET
    elvaras: DONTS
    alert: true
    magyarazat: 'Fésű: az magasabb ismert szín felüllicitje a mi magasabb szabad színünket mutatja. Leállás VAGY gémforsz
      — a következő licitem dönti el.'
