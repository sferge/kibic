  - fejezet: "Felmentés: kontra induló erő nélkül a minorra (2026-10-21)"
    # A szerkesztő: jó elosztású, 8-9 lapos nemes lappal (a kontrázott
    # színben legfeljebb 2 lap) induló erő nélkül is kontra — nem kell az
    # ötös nemest mondani. Rossz pontokkal (dáma-bubi, kevés ász-király:
    # legalább 2 kontroll, ász = 2, király = 1) nem.
    szabalyok:
      - {minta: "(1C) X", pont: "9-11", hossz: {C: 0-2}, minoseg: nem_rossz, kontroll: 2+,
         vagy: [{hossz: {H: 4, S: 4}}, {hossz: {H: 5, S: 4}}, {hossz: {H: 4, S: 5}}],
         forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 58,
         alert: "Információs kontra (felmentés): 8-9 lap a nemesekben, legfeljebb 2 treff"}
      - {minta: "(1D) X", pont: "9-11", hossz: {D: 0-2}, minoseg: nem_rossz, kontroll: 2+,
         vagy: [{hossz: {H: 4, S: 4}}, {hossz: {H: 5, S: 4}}, {hossz: {H: 4, S: 5}}],
         forsz: EGY_MENET, elvaras: VALASSZ, prioritas: 58,
         alert: "Információs kontra (felmentés): 8-9 lap a nemesekben, legfeljebb 2 káró"}
  - fejezet: "Kontra, majd szan a blokkra (2026-10-21)"
    # A szerkesztő: erős egyenletes lappal kontra, és a következő körben
    # szan (ugrás nélkül) — a nem ugró szan-közbeszólás erősebb párja.
    szabalyok:
      - {minta: "(2M) X (P) nA (P) +NT", pont: "19+", fogas: ["M"], elosztas: "BAL", prioritas: 57,
         magyarazat: "Kontra, majd szan: erős egyenletes lap (19+), fogással"}
      - {minta: "(2M) P (3M) X (P) nA (P) +NT", pont: "19+", fogas: ["M"], elosztas: "BAL", prioritas: 57,
         magyarazat: "Kontra, majd szan: erős egyenletes lap (19+), fogással"}
      - {minta: "(3M) X (P) nA (P) +NT", pont: "19+", fogas: ["M"], elosztas: "BAL", prioritas: 57,
         magyarazat: "Kontra, majd szan: erős egyenletes lap (19+), fogással"}
  - fejezet: "Erős kontra, majd a saját szín (2026-10-21)"
    # A szerkesztő: 18+ ponttal kontra, utána a saját (5+) szín — erős lap
    # (a minor kontrája egyébként legalább 4-3 a nemesekben).
    szabalyok:
      - {minta: "(1A) X (P) nB (P) +C", pont: "18-21", hossz: {C: 5+},
         ha: {nyers: {t: NEM, gy: [{t: MONDVA, ki: ok, szin: C}]}, partner_nem_mondta: C},
         prioritas: 56, magyarazat: "Kontra, majd saját szín: erős lap (18-21), 5+ lap"}
      - {minta: "(1A) X (P) nB (P) +D", pont: "18-21", hossz: {D: 5+},
         ha: {nyers: {t: NEM, gy: [{t: MONDVA, ki: ok, szin: D}]}, partner_nem_mondta: D},
         prioritas: 56, magyarazat: "Kontra, majd saját szín: erős lap (18-21), 5+ lap"}
      - {minta: "(1A) X (P) nB (P) +H", pont: "18-21", hossz: {H: 5+},
         ha: {nyers: {t: NEM, gy: [{t: MONDVA, ki: ok, szin: H}]}, partner_nem_mondta: H},
         prioritas: 56, magyarazat: "Kontra, majd saját szín: erős lap (18-21), 5+ lap"}
      - {minta: "(1A) X (P) nB (P) +S", pont: "18-21", hossz: {S: 5+},
         ha: {nyers: {t: NEM, gy: [{t: MONDVA, ki: ok, szin: S}]}, partner_nem_mondta: S},
         prioritas: 56, magyarazat: "Kontra, majd saját szín: erős lap (18-21), 5+ lap"}
      # a kontrázó emelése a partner (1-es szintű) kényszerválaszára
      - {minta: "(1A) X (P) 1M (P) 2M", pont: "16-18", hossz: {M: 4+}, prioritas: 57, magyarazat: "Emelés: 16-18 FP, 4+ adu"}
      - {minta: "(1A) X (P) 1M (P) 3M", pont: "19-21", hossz: {M: 4+}, prioritas: 57, magyarazat: "Ugró emelés: 19-21 FP, 4+ adu (invit)"}
      - {minta: "(1A) X (P) 1M (P) 4M", pont: "22+", hossz: {M: 4+}, prioritas: 57, magyarazat: "Gém: 22+ FP, 4+ adu"}
