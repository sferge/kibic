# Kieg.: a pontsávok a Takeout Double.pdf szerint (1-es szint 12+, 2-es 13+,
# 3-as 14+, újranyitó 9+). A klubdokumentum: 'INFORMÁCIÓS KONTRA: 4♥-ig'.
