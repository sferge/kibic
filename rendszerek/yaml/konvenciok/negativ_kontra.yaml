# Generálva a klubdokumentum szabályaiból (M-centrikus; minor után 4♠-ig,
# nemes után 3♠-ig). A pontsávok: 1-es szint 7+, 2-es 8+, 3-as 10+ (kieg.).
# 1m-(1♥)-X = pontosan 4 pikk, mert 1m-(1♥)-1♠ = 5+ pikk.
rendszer:
  kod: NEGATIV_KONTRA
  nev: "Negatív kontra"
  nev_en: "Negative Double"
  fajta: KONVENCIO
  tema: "Nyitásunk után: a színközbeszólás kontrája"
  leiras: "Nyitásunk után a színközbeszólás kontrája: nemes-centrikus, 1-es szinten 7+ FP, szintenként 1,5-2 FP-tal több. Forrás: KÜZDELMI & VÉDEKEZŐ licitek.doc"
fejezetek:
  - fejezet: "Negatív kontra"
    szabalyok:
      - {minta: "1C (1D) X", pont: 7+, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 7+ FP, nemes szín(ek)", vagy: [{"hossz": {"H": "4+", "S": "4+"}}]}
      - {minta: "1C (2D) X", pont: 8+, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 8+ FP, nemes szín(ek)", vagy: [{"hossz": {"H": "4+"}}, {"hossz": {"S": "4+"}}]}
      - {minta: "1C (3D) X", pont: 10+, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 10+ FP, nemes szín(ek)", vagy: [{"hossz": {"H": "4+"}}, {"hossz": {"S": "4+"}}]}
      - {minta: "1C (1H) X", pont: 7+, hossz: {"S": "4"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 7+ FP, 4 pikk"}
      - {minta: "1C (2H) X", pont: 8+, hossz: {"S": "4+"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 8+ FP, 4+ pikk"}
      - {minta: "1C (3H) X", pont: 10+, hossz: {"S": "4+"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 10+ FP, 4+ pikk"}
      - {minta: "1C (1S) X", pont: 7+, hossz: {"H": "4+"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 7+ FP, 4+ kőr"}
