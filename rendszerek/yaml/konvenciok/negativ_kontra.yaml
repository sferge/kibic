  - fejezet: "A nyitó a negatív kontra után"
    jegyzet: >-
      2026-10-02, Moha. A partner kontrája NEM büntető (negatív: a kontrázott
      színben rövidséget ígér) — ha a nyitó passzol, BÜNTETŐVÉ alakítja.
      Ez csak akkor jó, ha (1) erős, biztos aduink vannak, (2) nincs erőnk a
      3NT-hez, és (3) a 2NT kevesebbet érne a kontrázott bukásnál — ezért a
      büntető passz MÉRLEGELŐ: a szimuláció dönti el; szimuláció nélkül nem
      passzolunk. Egyébként licitálunk:
        * a partner (ígért) 4-es színe — plusz erővel ugorva;
        * a saját színünk ismétlése — plusz hosszal (plusz erővel ugorva);
        * szan — fogással, de 3NT-hez kevés erővel (elég erővel 3NT);
        * új szín — kétszínű lappal (plusz erővel ugorva);
        * felüllicit — erős lap, nincs adu, nincs BIZTOS fogás (félfogás:
          dubló dáma, üres király): fogást keres a partnernél, cél a 3NT;
        * „kínunkban” — ha semmi sem illik, akkor sem passz: a várhatóan
          legolcsóbb bukás (a partner hármas színe, a saját eredeti szín).
      A pontsávok (12-14 / 15-17 / 18+) kieg., átnézendők.
    szabalyok:
      - {minta: "1A (nB) X (P) P", kulcs: NEG-X-BUNTETO-PASSZ, prioritas: 60, dontesi_mod: MERLEGELO,
         pont: 12-17, hossz: {B: 4+}, fohonor: {B: 2+},
         magyarazat: "Büntető passz: a negatív kontrát büntetővé alakítja (erős, biztos aduk)"}
      # a partner 4-es (nemes) színe
      - {minta: "1A (nB) X (P) +M", kulcs: NEG-X-PARTNER, prioritas: 56, kulonbozo: [A, B, M],
         pont: 12-14, hossz: {M: 4+}, magyarazat: "A partner (ígért) színe, 4 lappal"}
      - {minta: "1A (nB) X (P) 2M", kulcs: NEG-X-PARTNER-UGRO2, prioritas: 57, kulonbozo: [A, B, M],
         ha: {ugras: true}, pont: 15-17, hossz: {M: 4+}, magyarazat: "A partner színe ugrással: 4 lap, plusz erő"}
      - {minta: "1A (nB) X (P) 3M", kulcs: NEG-X-PARTNER-UGRO3, prioritas: 57, kulonbozo: [A, B, M],
         ha: {ugras: true}, pont: 15-17, hossz: {M: 4+}, magyarazat: "A partner színe ugrással: 4 lap, plusz erő"}
      - {minta: "1A (nB) X (P) 4M", kulcs: NEG-X-PARTNER-GEM, prioritas: 57, kulonbozo: [A, B, M],
         pont: 18+, hossz: {M: 4+}, magyarazat: "Gém a partner színében"}
      # a saját szín ismétlése
      - {minta: "1A (nB) X (P) +A", kulcs: NEG-X-SAJAT, prioritas: 54,
         pont: 12-14, hossz: {A: 6+}, magyarazat: "A saját szín ismétlése: plusz hossz"}
      - {minta: "1A (nB) X (P) 3A", kulcs: NEG-X-SAJAT-UGRO, prioritas: 55,
         ha: {ugras: true}, pont: 15-17, hossz: {A: 6+}, magyarazat: "A saját szín ugrással: plusz hossz, plusz erő"}
      # szan
      - {minta: "1A (nB) X (P) +NT", kulcs: NEG-X-SZAN, prioritas: 53,
         pont: 12-14, fogas: [B], magyarazat: "Szan: fogás az ellenfél színében, 3NT-hez kevés erő"}
      - {minta: "1A (nB) X (P) 3NT", kulcs: NEG-X-3SZAN, prioritas: 55,
         pont: 15+, fogas: [B], magyarazat: "3NT: fogás az ellenfél színében, elég erővel"}
      # új szín (kétszínű)
      - {minta: "1A (nB) X (P) +E", kulcs: NEG-X-UJ, prioritas: 52, kulonbozo: [A, B, E],
         pont: 12-17, hossz: {A: 5+, E: 4+}, magyarazat: "Új szín: kétszínű lap"}
      - {minta: "1A (nB) X (P) 3E", kulcs: NEG-X-UJ-UGRO, prioritas: 53, kulonbozo: [A, B, E],
         ha: {ugras: true}, pont: 18+, hossz: {A: 5+, E: 4+}, forsz: GEMFORSZ,
         magyarazat: "Új szín ugrással: kétszínű lap, plusz erő"}
      # felüllicit: erős lap, félfogás
      - {minta: "1A (nB) X (P) +B", kulcs: NEG-X-FELUL, prioritas: 51,
         pont: 15+, nincs_fogas: [B], vagy: [{lapok: [BK]}, {lapok: [BQ]}], forsz: GEMFORSZ,
         alert: "Felüllicit: erős lap, nincs biztos fogás (félfogás) — fogást keres, cél a 3NT"}
      # „kínunkban”: a büntető passz helyett a legolcsóbb bukás
      - {minta: "1A (nB) X (P) +M", kulcs: NEG-X-KIN-PARTNER, prioritas: 41, kulonbozo: [A, B, M],
         hossz: {M: 3+}, magyarazat: "Kényszerből: a partner színe 3 lappal (a passz büntető volna)"}
      - {minta: "1A (nB) X (P) +A", kulcs: NEG-X-KIN-SAJAT, prioritas: 40,
         hossz: {A: 3+}, magyarazat: "Kényszerből: a saját színem (a passz büntető volna)"}
      - {minta: "1A (nB) X (P) +E", kulcs: NEG-X-KIN-UJ, prioritas: 39, kulonbozo: [A, B, E],
         hossz: {E: 3+}, magyarazat: "Kényszerből: a legolcsóbb hármas szín (a passz büntető volna)"}
