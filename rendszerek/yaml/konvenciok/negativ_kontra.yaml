      - {minta: "1C (2H) X", pont: 8+, hossz: {"S": "4+"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 8+ FP, 4+ pikk"}
      - {minta: "1C (3H) X", pont: 10+, hossz: {"S": "4+"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 10+ FP, 4+ pikk"}
