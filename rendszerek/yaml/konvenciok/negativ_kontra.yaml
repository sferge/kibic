         alert: "Negatív kontra: rövid ellenfél-szín, 8+ FP"}
      - {minta: "1C (1D) X", pont: 9+, hossz: {D: 2}, nincs_fogas: [D], forsz: EGY_MENET, prioritas: 49,
         alert: "Negatív kontra: 9+ FP, nincs fogás"}
