      kevesebb lap van a nem mondott nemesben, ÉS nincs fogás az ellenfél
      színében (akkor szan volna), ÉS minél kevésbé rövid az ellenfél
      színe, annál több pont kell. Invit erővel (10+) viszont NEM
      PASSZOLUNK: ha más nem illik, kontra. A pozitív szabad licit (5+
      szín, SZABAD_LICIT_MIN+) és az emelések előbb jönnek (prioritás).
      A határok kieg., átnézendők.
