      - {minta: "1D (3C) X", pont: 10+, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 10+ FP, nemes szín(ek)", vagy: [{"hossz": {"H": "4+"}}, {"hossz": {"S": "4+"}}]}
      - {minta: "1D (1H) X", pont: 7+, hossz: {"S": "4"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 7+ FP, 4 pikk"}
      - {minta: "1D (2H) X", pont: 8+, hossz: {"S": "4+"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 8+ FP, 4+ pikk"}
      - {minta: "1D (3H) X", pont: 10+, hossz: {"S": "4+"}, forsz: EGY_MENET, prioritas: 55, alert: "Negatív kontra: 10+ FP, 4+ pikk"}
