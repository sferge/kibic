# POZITÍV SZABAD LICIT (2026-10-02, Moha). Megállapodás: ha a nyitásunk
# után az ellenfél közbeszól, a válaszoló NEM UGRÓ új színe a 2-es (3-as)
# szinten POZITÍV: legalább SZABAD_LICIT_MIN figurapont (alapból 10; van,
# aki 11-et játszik — a rendszer vagy a pár paramétere) és 5+ lap; egy körre
# kényszerít. Egy ponttal kevesebb is elég, ha a lap JÓ (LAPMINOSEG).
# Ami ide nem fér (kevesebb pont, nincs ötös szín), arra a negatív kontra
# való, 10 ponttal pedig nem passzolunk (NEGATIV_KONTRA: „minden más”).
#
# Az alternatívája a NEGATÍV szabad licit (gyenge, nem kényszerítő új szín)
# — az még nincs megírva.
#
# A KIBIC_STAND-on a KIBICEGY_KUZDELMI ugyanezen licitjeit felülírja (azok
# 10+ fix határral szóltak). Az 1-es szintű új szín (1♣ (1♦) 1♥) nem
# szabad licit: az 6+, 4+ lap marad.
# A 3-as szintű szabad licit (pl. 1♠ (2♥) 3♣) határa ugyanez — kieg.
rendszer:
  kod: POZITIV_SZABAD_LICIT
  nev: Pozitív szabad licit
  nev_en: Positive free bid
  fajta: KONVENCIO
  tema: "Közbeszólás után: a válaszoló új színe"
  leiras: "A nyitásunkra adott közbeszólás után a válaszoló nem ugró új színe 2-es (3-as) szinten pozitív: SZABAD_LICIT_MIN+ FP (alapból 10), 5+ lap, kényszerít."
fejezetek:
  - fejezet: "Pozitív szabad licit"
    szabalyok:
      - {minta: "1C (1H) 2D", pont: {param: SZABAD_LICIT_MIN, alap: 10}, hossz: {D: 5+},
         forsz: EGY_MENET, prioritas: 58, magyarazat: "Pozitív szabad licit: 5+ káró, kényszerít"}
      - {minta: "1C (1H) 2D", pont: {param: SZABAD_LICIT_MIN, alap: 10, eltolas: -1}, minoseg: jo,
         hossz: {D: 5+}, forsz: EGY_MENET, prioritas: 58,
