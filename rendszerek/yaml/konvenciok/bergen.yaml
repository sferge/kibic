rendszer:
  kod: BERGEN
  nev: Bergen-emelések
  nev_en: Bergen Raises
  fajta: KONVENCIO
  tema: "1M után: limit- és gyenge emelés"
  leiras: "1M után a 3♣ gyenge, a 3♦ erős emelés 4+ aduval. Utána az új szín invit (kieg.: a sávok a Bergen.pdf szerint)."
fejezetek:
  - fejezet: Bergen
    szabalyok:
      # csak „normál” helyzetben: a válaszoló nem passzolt; passzos partnertől
      # a Drury él (a szerkesztő, 2026-11-12)
      - {minta: 1M-3C, ha: {passzolt: nem}, pont: 7-9, hossz: {M: 4+}, forsz: EGY_MENET, prioritas: 59,
         alert: "Gyenge Bergen: 7-10 FP, 4+ adu", nyers: "3♣ | Gyenge Bergen (utána új szín, invit)"}
      - {minta: 1M-3D, ha: {passzolt: nem}, pont: 10-12, hossz: {M: 4+}, forsz: EGY_MENET, prioritas: 59,
         alert: "Erős Bergen: 10-12 FP, 4+ adu", nyers: "3♦ | Erős Bergen (utána új szín, invit)"}
      # a nyitó (kieg.)
      - {minta: 1M-3C-3M, ha: {partner_passzolt: nem}, pont: 12-14, prioritas: 50, magyarazat: "Leállás"}
      - {minta: 1M-3C-4M, ha: {partner_passzolt: nem}, pont: 15+, prioritas: 51, magyarazat: "Gém"}
      - {minta: 1M-3D-3M, ha: {partner_passzolt: nem}, pont: 12-13, prioritas: 50, magyarazat: "Leállás"}
      - {minta: 1M-3D-4M, ha: {partner_passzolt: nem}, pont: 14+, prioritas: 51, magyarazat: "Gém"}
