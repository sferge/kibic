      - {minta: ".. 3NT 4D 4NT", kulcs: MOHA-3NT-4D-2, fajta: ELV, kulcslapok: [1, 4], kulcs_adu: D, prioritas: 11, jelentes: {kulcslap: {adu: D, ertek: [1, 4], dama: null}}, alert: "1 vagy 4 kulcslap (káró adu)"}
      - {minta: ".. 3NT 4D 5C", kulcs: MOHA-3NT-4D-3, fajta: ELV, kulcslapok: 2, adu_dama: false, kulcs_adu: D, prioritas: 11, jelentes: {kulcslap: {adu: D, ertek: [2, 5], dama: false}}, alert: "2 kulcslap, káró dáma nélkül (káró adu)"}
      - {minta: ".. 3NT 4D 5D", kulcs: MOHA-3NT-4D-4, fajta: ELV, kulcslapok: 2, adu_dama: true, kulcs_adu: D, prioritas: 13, jelentes: {kulcslap: {adu: D, ertek: [2, 5], dama: true}}, alert: "2 kulcslap, káró dámával (káró adu)"}
  - fejezet: "A „tetszik” után: relé-kulcslapkérdés és válaszai"
    szabalyok:
      - {minta: ".. 3NT 4C 4D 4H", kulcs: MOHA-3NT-RELE-TREFF, fajta: ELV, forsz: EGY_MENET, prioritas: 12, alert: "Relé: kulcslapkérdés treff aduval"}
      - {minta: ".. 3NT 4C 4H 4S", kulcs: MOHA-3NT-RELE-KARO-B, fajta: ELV, ha: {minor_nem_igerve: C}, forsz: EGY_MENET, prioritas: 12, alert: "Relé: kulcslapkérdés káró aduval"}
      - {minta: ".. 3NT 4D 4H 4S", kulcs: MOHA-3NT-RELE-KARO, fajta: ELV, forsz: EGY_MENET, prioritas: 12, alert: "Relé: kulcslapkérdés káró aduval"}
