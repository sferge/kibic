    # A szerkesztő: a NEM UGRÓ szan természetes — erős, egyenletes lap,
    # fogással; az UGRÓ 4NT a szokatlan szan (SZOKATLAN_2NT).
    szabalyok:
      - {minta: "(2M) +NT", pont: "16-19", fogas: ["M"], elosztas: "BAL", prioritas: 58,
         magyarazat: "Természetes 2NT a gyenge kettesre: 16-19 FP (mint az 1NT-közbeszólás), egyenletes, fogással"}
