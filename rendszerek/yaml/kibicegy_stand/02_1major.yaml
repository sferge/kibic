# AZ 1 MAJOR INDULÁS — válaszok és folytatások.
# A Bergen (3♣/3♦), a Jacoby 2NT, a splinterek, a Kanthar és a Wolff
# külön konvencióban vannak (konvenciok/), itt csak a természetes licitek.
# Erősség-sávok, ahol a dokumentum nem mond mást (kieg.):
#   válaszoló: 6-10 minimum, 11-12 invit, 13+ gém
#   nyitó:     12-14 minimum, 15-17 extra, 18-19 erős
rendszer: {kod: KIBICEGY_STAND}
fejezetek:
  - fejezet: Az 1Major indulás
    szabalyok:
      - {minta: 1H-1S, pont: 6+, hossz: {S: 4+}, forsz: EGY_MENET, prioritas: 55,
         magyarazat: "4+ pikk, 6+ FP", nyers: "1♠ | 4+ szín"}
      - {minta: 1M-1NT, pont: 6-10, hossz: {M: 0-2}, prioritas: 40,   # kieg.: 6-10
         magyarazat: "6-10 FP, nem kényszerít; minimummal 5332-vel passzt kér",
         nyers: "1N | Nem kényszerít; 5332-vel; minimummal 11-13 passzt kér"}
      - {minta: 1H-1NT, pont: 6-10, hossz: {H: 0-2, S: 0-3}, prioritas: 41,
         kulcs: 1H-1NT, magyarazat: "6-10 FP, nincs 4-es pikk, nincs kőrtámogatás"}
      - {minta: 1M-2C, pont: 12+, hossz: {C: 2+}, forsz: GEMFORSZ, prioritas: 50,
         ha: {ules: [3, 4]},          # passzolt kézzel ez nem gémforsz (Drury)
         alert: "2/1: gémforsz, lehet dubló is", nyers: "2♣ | GF, lehet dubló is"}
      - {minta: 1M-2D, pont: 11+, hossz: {D: 5+}, forsz: EGY_MENET, prioritas: 52,
         magyarazat: "11+ FP, 5+ káró", nyers: "2♦ | 11+FP, 5+ szín"}
      - {minta: 1S-2H, pont: 11+, hossz: {H: 5+}, forsz: EGY_MENET, prioritas: 53,
         magyarazat: "11+ FP, legalább átlagos 5-ös kőr", nyers: "2♥ (1♠-re) | 11+FP, 5+ szín."}
      - {minta: 1H-2S, pont: 2-5, hossz: {S: 6+}, prioritas: 45,       # kieg.: 2-5
         alert: "Gyenge ugró: 6+ pikk, gyenge", nyers: "2♠ (1♥-re) | 6+; gyenge"}
      - {minta: 1S-3H, pont: 2-6, hossz: {H: 6+, S: 0-2}, prioritas: 45,  # kieg.
         alert: "Gyenge ugró: 6+ kőr, gyenge", nyers: "3♥ (1♠-re) | 6+; gyenge"}
      - {minta: 1M-2M, pont: 6-9, hossz: {M: 3}, prioritas: 60,
         magyarazat: "6-9 FP, 3-as támogatás, nem kényszerít",
         nyers: "2M | 6-9 ep, 3-as támogatás; nem kényszerít (másutt: 7-10FP)"}
      - {minta: 1M-3M, pont: 0-6, hossz: {M: 4+}, forsz: KIZARO, prioritas: 58,  # kieg.
         magyarazat: "Kizáró emelés, gyenge, 4+ adu", nyers: "3M | gyenge"}
      - {minta: 1M-3NT, pont: 13-15, elosztas: BAL, hossz: {M: 0-2}, prioritas: 51,  # kieg.
         magyarazat: "Leállás, egyenletes", nyers: "3N | To play"}

  - fejezet: "1♥ – 1♠ után a nyitó"
    szabalyok:
      - {minta: 1H-1S-1NT, pont: 12-14, elosztas: BAL, hossz: {S: 0-3}, prioritas: 50,
         magyarazat: "11-14 FP, nincs 4-es pikk, kvázi egyenletes",
         nyers: "1N | Ø 4-es támogatás, kvázi BAL; 11-14 fp"}
      - {minta: 1H-1S-2C, pont: 12-17, hossz: {C: 4+, S: 0-3}, rel: ["C>=D"], prioritas: 51,
         magyarazat: "Természetes, 4+ treff", nyers: "2♣ | NAT, 4+ színnel."}
      - {minta: 1H-1S-2D, pont: 12-17, hossz: {D: 4+, S: 0-3}, rel: ["D>C"], prioritas: 51,
         alert: "Természetes, 4+ káró", nyers: "2♦! | NAT, 4+ színnel."}
      - {minta: 1H-1S-2H, pont: 12-14, hossz: {H: 6+, S: 0-3}, prioritas: 53,
         magyarazat: "Gyenge lap, 6-os kőr", nyers: "2♥ | Gyenge lap 6-os ♥-rel"}
      - {minta: 1H-1S-2S, pont: 12-14, hossz: {S: 4}, prioritas: 56,
         magyarazat: "Alsó zóna, 4-es pikk", nyers: "2♠ | NAT, AZ, 4 M"}
      - {minta: 1H-1S-2NT, pont: 18-19, elosztas: BAL, hossz: {S: 0-3}, prioritas: 55,
         alert: "Másfél szan (18-19 FP); utána Wolff-leállás",
         nyers: "2N! | Másfél szan (18-19 fp); utána Wolf-leállás"}
      - minta: 1H-1S-3C
        pont: 16+
        vagy: [{hossz: {H: 5+, C: 5+}}, {hossz: {H: 5+, C: 4+}, pont: 18+}]
        forsz: GEMFORSZ
        prioritas: 57
        alert: "Gémforsz: 55+ vagy erős 5-4"
        nyers: "3m! | FZ; 55+ elosztás (vagy erős 5-4)"
      - minta: 1H-1S-3D
        pont: 16+
        vagy: [{hossz: {H: 5+, D: 5+}}, {hossz: {H: 5+, D: 4+}, pont: 18+}]
        rel: ["D>C"]
        forsz: GEMFORSZ
        prioritas: 57
        alert: "Gémforsz: 55+ vagy erős 5-4"
      - {minta: 1H-1S-3H, pont: 16-17, hossz: {H: 6+, S: 0-3}, prioritas: 58,
         alert: "Géminvit, 6-os kőr", nyers: "3♥! | GI, 6-os ♥-rel"}
      - {minta: 1H-1S-3S, pont: 15-17, hossz: {S: 4}, prioritas: 59,
         magyarazat: "Invit, 4-es pikk", nyers: "3♠ | Invit; NAT"}

  - fejezet: "1♥ – 1♠ – 1NT után a válaszoló"
    szabalyok:
      - {minta: 1H-1S-1NT-2D, pont: 6-10, hossz: {D: 5+}, prioritas: 50,
         magyarazat: "Természetes, alsó zóna", nyers: "2♦ | NAT; alsózóna"}
      - {minta: 1H-1S-1NT-2H, pont: 6-10, hossz: {H: 2+}, prioritas: 49,
         magyarazat: "Alsó zóna, kőr-preferencia", nyers: "2♥ | AZ; NAT"}
      - {minta: 1H-1S-1NT-2S, pont: 6-10, hossz: {S: 6+}, prioritas: 51,
         magyarazat: "Alsó zóna, 6+ pikk", nyers: "2♠ | AZ; 6+"}
      - {minta: 1H-1S-1NT-2NT, pont: 11-12, hossz: {S: 4}, prioritas: 50,
         magyarazat: "Invit", nyers: "2NT | Invit"}
      - {minta: 1H-1S-1NT-3C, pont: 13+, hossz: {C: 5+}, forsz: GEMFORSZ, prioritas: 52,
         magyarazat: "Gémforsz, természetes", nyers: "3♣ | FZ; NAT"}
      - {minta: 1H-1S-1NT-3D, pont: 13+, hossz: {D: 5+}, forsz: GEMFORSZ, prioritas: 52,
         magyarazat: "Gémforsz, természetes", nyers: "3♦ | FZ; NAT"}
      - {minta: 1H-1S-1NT-3S, pont: 11-12, hossz: {S: 6+}, prioritas: 52,
         magyarazat: "Invit, 6+ pikk", nyers: "3♠ | Invit; 6+"}
      - {minta: 1H-1S-1NT-3NT, pont: 13-17, hossz: {S: 4, H: 0-2}, prioritas: 50,
         magyarazat: "Leállás", nyers: "3NT | To play"}
      - {minta: 1H-1S-1NT-4H, pont: 13+, hossz: {H: 3+}, prioritas: 53,
         magyarazat: "Leállás", nyers: "4♥ | To play"}

  - fejezet: "1♥ – 1♠ – 2♣ után a válaszoló"
    szabalyok:
      - {minta: 1H-1S-2C-2D, pont: 13+, forsz: GEMFORSZ, prioritas: 45,
         alert: "Negyedik szín, gémforsz", nyers: "2♦! | Negyedik szín; GF"}
      - {minta: 1H-1S-2C-2H, pont: 6-10, hossz: {H: 2-3}, prioritas: 51,
         magyarazat: "Leállás, 2-3 kőr", nyers: "2♥ | NAT; leállás, 2-3 kőr"}
      - {minta: 1H-1S-2C-2S, pont: 6-10, hossz: {S: 6+}, prioritas: 52,
         magyarazat: "Alsó zóna, 6+ pikk", nyers: "2♠ | AZ; 6+"}
      - {minta: 1H-1S-2C-2NT, pont: 11-12, hossz: {H: 0-2}, prioritas: 50,
         magyarazat: "Invit", nyers: "2NT | Invit"}
      - {minta: 1H-1S-2C-3C, pont: 11-12, hossz: {C: 4+}, prioritas: 51,
         magyarazat: "Invit, 4+ treff", nyers: "3♣ | NAT; Invit; 4+"}
      - {minta: 1H-1S-2C-3H, pont: 11-12, hossz: {H: 3+}, prioritas: 53,
         magyarazat: "Invit, kőrtámogatás", nyers: "3♥ | Invit"}
      - {minta: 1H-1S-2C-3S, pont: 11-12, hossz: {S: 6+}, prioritas: 52,
         magyarazat: "Invit, 6+ pikk", nyers: "3♠ | Invit; 6+"}
      - {minta: 1H-1S-2C-3NT, pont: 13+, hossz: {H: 0-2}, prioritas: 49,
         magyarazat: "Leállás", nyers: "3nt | To play"}

  - fejezet: "1♥ – 1♠ – 2♦ után a válaszoló"
    szabalyok:
      - {minta: 1H-1S-2D-3C, pont: 13+, forsz: GEMFORSZ, prioritas: 50,
         alert: "Gémforsz, relé (a 3-as pikket bejelezzük, egyébként természetes)",
         nyers: "3♣! | GF, relé. (3as pikket bejelezzük, egyébként NAT)."}

  - fejezet: "1♥ – 1♠ – 2♥ után a válaszoló"
    szabalyok:
      - {minta: 1H-1S-2H-2S, pont: 6-10, hossz: {S: 5+}, prioritas: 50,
         alert: "Természetes", nyers: "2♠! | NAT"}
      - {minta: 1H-1S-2H-2NT, pont: 11-12, hossz: {H: 0-2}, forsz: EGY_MENET, prioritas: 50,
         magyarazat: "Invit; erre mutatni kell a 3-as pikket", nyers: "2N | INV.; Erre mutatni kell a 3as pikket"}
      - {minta: 1H-1S-2H-3C, pont: 11-12, hossz: {C: 5+}, rel: ["C>=D"], prioritas: 51,
         magyarazat: "Invit, kanapé lehetséges", nyers: "3m | INV., kanapé lehetséges"}
      - {minta: 1H-1S-2H-3D, pont: 11-12, hossz: {D: 5+}, rel: ["D>C"], prioritas: 51,
         magyarazat: "Invit, kanapé lehetséges"}
      - {minta: 1H-1S-2H-3H, pont: 11-12, hossz: {H: 2+}, prioritas: 52,
         magyarazat: "Invit", nyers: "3M | INV."}
      # 2026-10-04 (Moha): a 3NT LEÁLLÁS — felső határ kell. 17+ ponttal és két
      # kőrrel (6+2 = 8 lapos adu) szlemgyanú van, az nem 3NT.
      - {minta: 1H-1S-2H-3NT, pont: 13-16, hossz: {H: 0-2}, prioritas: 49,
         magyarazat: "Leállás", nyers: "3N | t/p"}
      - {minta: 1H-1S-2H-4NT, pont: 18+, elosztas: BAL, prioritas: 52,
         alert: "Kvantitatív kulcslapkérdés", nyers: "4N | BAL; kvantitatív kulcslapkérdés"}

  - fejezet: "1♥ – 1♠ – 2♠ után a válaszoló"
    szabalyok:
      - {minta: 1H-1S-2S-2NT, pont: 11-12, hossz: {S: 4+}, forsz: EGY_MENET, prioritas: 50,
         alert: "Invit, kérdez", nyers: "2N! | INVIT; kérdez"}
      - {minta: 1H-1S-2S-3C, pont: 13+, hossz: {C: 4+}, rel: ["C>=D"], prioritas: 50,
         magyarazat: "Géminvit, természetes", nyers: "3m | GI, NAT"}
      - {minta: 1H-1S-2S-3D, pont: 13+, hossz: {D: 4+}, rel: ["D>C"], prioritas: 50,
         magyarazat: "Géminvit, természetes"}
      # a 2NT-re adott válaszok (a nyitó):
      - {minta: 1H-1S-2S-2NT-3C, pont: 13-14, hossz: {C: 4+}, prioritas: 50,
         magyarazat: "Természetes, fogadja az invitet", nyers: "3m: NAT; fogadja az invitet"}
      - {minta: 1H-1S-2S-2NT-3D, pont: 13-14, hossz: {D: 4+}, prioritas: 50,
         magyarazat: "Természetes, fogadja az invitet"}
      - {minta: 1H-1S-2S-2NT-3H, pont: 12-14, hossz: {H: 6+}, prioritas: 51,
         magyarazat: "6-4", nyers: "3♥, 3♠!: NAT; 6-4"}
      - {minta: 1H-1S-2S-2NT-3S, pont: 12, prioritas: 49,
         alert: "Nem fogadja az invitet", nyers: "3♠!: nem fogadja az invitet"}

  - fejezet: "1♥ – 1♠ – 2NT után a válaszoló"
    szabalyok:
      - {minta: 1H-1S-2NT-3D, pont: 13+, hossz: {D: 5+}, forsz: GEMFORSZ, prioritas: 52,
         magyarazat: "Természetes, gémforsz", nyers: "3♦ | NAT; gf"}
      - {minta: 1H-1S-2NT-3H, pont: 13+, hossz: {H: 2}, forsz: GEMFORSZ, prioritas: 50,
         magyarazat: "Dubló kőr, gémforsz", nyers: "3♥ | Dubló; gf"}
      - {minta: 1H-1S-2NT-3S, pont: 6+, hossz: {S: 5+}, forsz: GEMFORSZ, prioritas: 51,
         magyarazat: "Természetes, gémforsz", nyers: "3♠ | Nat; gf"}
      - {minta: 1H-1S-2NT-3NT, pont: 6-12, hossz: {S: 4, H: 0-2}, prioritas: 49,
         magyarazat: "Leállás", nyers: "3N | To play"}
      - {minta: 1H-1S-2NT-4H, pont: 6-12, hossz: {H: 3+}, prioritas: 52,
         magyarazat: "Leállás", nyers: "4♥ | To play"}

  - fejezet: "1♥ – 1♠ – 3m után a válaszoló"
    szabalyok:
      - {minta: 1H-1S-3C-3D, prioritas: 50, forsz: EGY_MENET,
         alert: "F1; elsősorban pikktámogatást kérdez", nyers: "3♦ | F1; elsősorban pikktámogatást kérdez"}
      - {minta: 1H-1S-3m-3H, hossz: {H: 2+}, prioritas: 51,
         magyarazat: "Természetes, leállás", nyers: "3♥ | NAT; leállás"}
      - {minta: 1H-1S-3m-3S, hossz: {S: 5+}, prioritas: 52,
         magyarazat: "Természetes, leállás", nyers: "3♠ | NAT; leállás"}
      - {minta: 1H-1S-3m-3NT, hossz: {H: 0-2}, prioritas: 49,
         magyarazat: "Leállás", nyers: "3N | To play"}
      - {minta: 1H-1S-3m-4H, hossz: {H: 3+}, prioritas: 53,
         magyarazat: "Leállás", nyers: "4♥ | To play"}

  - fejezet: "1♥ – 1♠ – 3♥ után a válaszoló"
    szabalyok:
      # "3♠ | GF és fit!" — a fit a KŐR (2+ kőr a nyitó 6+ kőrje mellé).
      # Gyors-lassú elv (Moha): a lassú 3♠ szlemérdek, a gyors 4♥ leállás.
      - {minta: 1H-1S-3H-3S, pont: 8+, hossz: {H: 2+}, vagy: [{pont: 13+}, {vesztok: 0-6.5}],
         forsz: GEMFORSZ, prioritas: 52,
         alert: "Gémforsz, kőr fit (2+ kőr), szlemérdek: kulcslicitet kér", nyers: "3♠ | GF és fit!"}
      - {minta: 1H-1S-3H-4H, pont: 8+, hossz: {H: 2+}, prioritas: 51,
         magyarazat: "Leállás: kőr fit, nincs szlemérdek (gyors-lassú elv)"}
      - {minta: 1H-1S-3H-3NT, pont: 8+, hossz: {H: 0-1}, prioritas: 50,
         magyarazat: "Leállás", nyers: "3nt | To play"}

  - fejezet: "1M – 1NT után a nyitó"
    szabalyok:
      - {minta: 1M-1NT-2C, pont: 12-15, hossz: {C: 4+}, rel: ["C>=D"], prioritas: 50,
         alert: "Természetes, alsó zóna", nyers: "2♣! | NAT; AZ"}
      - {minta: 1M-1NT-2D, pont: 12-15, hossz: {D: 4+}, rel: ["D>C"], prioritas: 50,
         alert: "Természetes, alsó zóna", nyers: "2♦! | NAT; AZ"}
      - {minta: 1M-1NT-2M, pont: 12-14, hossz: {M: 6+}, prioritas: 51,
         magyarazat: "Hatos szín, minimum"}                                  # kieg.
      - {minta: 1M-1NT-2NT, pont: 17-18, elosztas: ["5332"], prioritas: 52,
         magyarazat: "5332, invit", nyers: "2nt | 5332; invit"}
      - {minta: 1M-1NT-3C, pont: 17+, hossz: {C: 4+}, rel: ["C>=D"], forsz: EGY_MENET, prioritas: 53,
         magyarazat: "5-4+, kényszerít", nyers: "3♣ | FZ; 5-4 +; kényszerít"}
      - {minta: 1M-1NT-3D, pont: 17+, hossz: {D: 4+}, rel: ["D>C"], forsz: EGY_MENET, prioritas: 53,
         magyarazat: "5-4+, kényszerít", nyers: "3♦ | FZ; 5-4 +; kényszerít"}
      - {minta: 1M-1NT-3M, pont: 16-18, hossz: {M: 6+}, prioritas: 54,
         magyarazat: "6+ szín, erős", nyers: "3M | FZ; 6+"}
      - {minta: 1M-1NT-3NT, pont: 19-21, elosztas: BAL, prioritas: 52,
         magyarazat: "Leállás", nyers: "3nt | To play"}
      - {minta: 1M-1NT-4M, pont: 18+, hossz: {M: 6+}, prioritas: 55,
         magyarazat: "Leállás", nyers: "4 M | To play"}

  - fejezet: "1M – 2♣ (gémforsz) után a nyitó"
    szabalyok:
      # (A Moha-kör 1M-2m gémforsz utáni nyitói licitjei: MOHA_1M, 2026-10-04.)
      - {minta: 1M-2C-2D, ha: {ules: [1, 2]}, hossz: {D: 4+}, forsz: GEMFORSZ, prioritas: 51,
         magyarazat: "Természetes, 4+ káró", nyers: "2♦ | NAT, 4+ szín."}
      - {minta: 1S-2C-2H, ha: {ules: [1, 2]}, hossz: {H: 4+}, forsz: GEMFORSZ, prioritas: 52,
         magyarazat: "Természetes, 4+ kőr", nyers: "2♥ (1♠-re) | NAT, 4+ szín."}
      - {minta: 1H-2C-2S, ha: {ules: [1, 2]}, hossz: {S: 4+}, forsz: GEMFORSZ, prioritas: 52,
         alert: "Természetes, 4+ pikk", nyers: "2♠ (1♥-re)! | NAT, 4+ szín."}
      - {minta: 1M-2C-2M, ha: {ules: [1, 2]}, hossz: {M: 6+}, forsz: GEMFORSZ, prioritas: 53,
         magyarazat: "6+ szín", nyers: "2M | 6+; NAT"}
      - {minta: 1M-2C-2NT, ha: {ules: [1, 2]}, pont: 15+, elosztas: ["5332"], forsz: GEMFORSZ, prioritas: 53,
         alert: "5332, többleterő", nyers: "2N! | 5332 elosztás; többleterő"}
      - {minta: 1M-2C-3C, ha: {ules: [1, 2]}, hossz: {C: 4+}, forsz: GEMFORSZ, prioritas: 50,
         magyarazat: "Természetes, 4+ treff", nyers: "3♣ | NAT, 4+"}
      - {minta: 1M-2C-3NT, ha: {ules: [1, 2]}, pont: 12-14, elosztas: ["5332"], prioritas: 53,
         alert: "5332, minimum", nyers: "3N! | 5332; minimum"}
      - {minta: 1M-2C-2M-2NT, ha: {ules: [3, 4]}, pont: 15+, forsz: GEMFORSZ, prioritas: 55,
         magyarazat: "Természetes, lapleírást kér", nyers: "2N | Nat, lapleírást kér"}
      - {minta: 1M-2C-2M-3NT, ha: {ules: [3, 4]}, hossz: {M: 0-2}, prioritas: 49,
         magyarazat: "Leállás", nyers: "3nt | To play"}
      # GYORS-LASSÚ ELV (Moha, 2026-09-30): erővel lassú. A 4M gyors = leállás,
      # minimális gémerő; a 3M lassú = plusz erő, szleminvit. A lassú emelés
      # után a nyitó tudja: az első szín (a treff) NAGYON JÓ — egy, de
      # inkább két fedő lesz benne (az xxx-e nem 3 vesztő).
      - {minta: 1M-2C-2M-3M, ha: {ules: [3, 4]}, hossz: {M: 2+}, fohonor: {C: 2+},
         vagy: [{igeret: {pont: felso}}, {vesztok: 0-6.5}], forsz: EGY_MENET, prioritas: 56,
         jelentes: {szin_fedo: {C: {min: 1, valoszinu: 2}}},
         alert: "Lassú emelés (gyors-lassú elv): plusz erő, szleminvit; nagyon jó treff (1-2 fedő)"}
      - {minta: 1M-2C-2M-4M, ha: {ules: [3, 4]}, hossz: {M: 2+}, igeret: {pont: also},
         vesztok: 7+, prioritas: 51,
         magyarazat: "Leállás: minimális gémerő (gyors-lassú elv)", nyers: "4M | To play"}

  - fejezet: "1♠ – 2♥ után a nyitó"
    szabalyok:
      - {minta: 1S-2H-2S, hossz: {H: 0-2}, vagy: [{hossz: {S: 6+}}, {hossz: {S: 5}, vagy: [{hossz: {C: 4+}}, {hossz: {D: 4+}}]}],
