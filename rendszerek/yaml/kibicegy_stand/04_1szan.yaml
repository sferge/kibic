# AZ 1NT INDULÁS (15-17) — a természetes válaszok. A Stayman, a Jacoby-
# és a Texas-transzfer, a Smolen és a Gerber külön konvenció.
rendszer: {kod: KIBICEGY_STAND}
fejezetek:
  - fejezet: Az 1NT indulás
    szabalyok:
      # A passz határa (a szerkesztő, 2026-10-23, #73): 0-7 ponttal és rossz
      # 8-cal passz. Rossz 8: rossz lapminőség (üres figurák, nincs 10-es,
      # 9-es), vagy egyenletes lap 4-es nemes nélkül (4-4 nemessel a Stayman
      # jöhet). 6+ lapos minorral marad a 3m invit (DD: +0,8/+1,8 IMP, #255).
      # Kivétel (külön konvenció): Junk Stayman, transzfer és leállás.
      - {minta: 1NT-P, prioritas: 47,
         vagy: [{pont: 0-7}, {pont: 8, vagy: [{minoseg: rossz}, {ures_figura: 1+}, {hossz: {S: 0-3, H: 0-3}, elosztas: BAL}]}],
         magyarazat: "Passz: 0-7 pont, vagy rossz 8"}
      - {minta: 1NT-2S, pont: 0-7, vagy: [{hossz: {C: 6+}}, {hossz: {D: 6+}}],
         hossz: {S: 0-3, H: 0-3}, forsz: EGY_MENET, elvaras: VALASZ, prioritas: 55,
         alert: "Leállás egyszínű minorban: 3♣-t kér",
         nyers: "2♠! | Leállás egyszínű minorban, 3 treffet kér"}
      - {minta: 1NT-2S-3C, prioritas: 50, magyarazat: "Kötelező 3♣"}
      - {minta: 1NT-2S-3C-3D, hossz: {D: 6+}, prioritas: 50,
         magyarazat: "Leállás 3♦-ban (a 3♣-t passzal hagyja, ha treff)"}
      - {minta: 1NT-2NT, pont: 8-9, elosztas: BAL, hossz: {S: 0-3, H: 0-3}, prioritas: 45,
         magyarazat: "Invit", nyers: "2N | invit"}
      - {minta: 1NT-3C, pont: 8-9, hossz: {C: 6+, S: 0-3, H: 0-3}, prioritas: 46,
         magyarazat: "Invit, hosszú treff", nyers: "3♣ | Inv"}
      - {minta: 1NT-3D, pont: 8-9, hossz: {D: 6+, S: 0-3, H: 0-3}, prioritas: 46,
         magyarazat: "Invit, hosszú káró", nyers: "3♦ | Inv"}
      - {minta: 1NT-3H, pont: 10+, hossz: {S: 3, H: 0-1}, vagy: [{hossz: {C: 5, D: 4}}, {hossz: {C: 4, D: 5}}],
         forsz: GEMFORSZ, prioritas: 57, alert: "3-1-(5-4): rövid kőr", nyers: "3♥ | 31(54)"}
      - {minta: 1NT-3S, pont: 10+, hossz: {S: 0-1, H: 3}, vagy: [{hossz: {C: 5, D: 4}}, {hossz: {C: 4, D: 5}}],
         forsz: GEMFORSZ, prioritas: 57, alert: "1-3-(5-4): rövid pikk", nyers: "3♠ | 13(54)"}
      - {minta: 1NT-3NT, pont: 10-15, hossz: {S: 0-3, H: 0-3}, prioritas: 44,
         magyarazat: "Leállás", nyers: "3N | To play"}
      - {minta: 1NT-4S, pont: 0-15, vagy: [{hossz: {C: 6+}}, {hossz: {D: 6+}}], hossz: {S: 0-3, H: 0-3},
         forsz: EGY_MENET, prioritas: 40,
         alert: "Minor transzfer", nyers: "4♠! | Minor tranfszer"}
         # kieg.: az erőt és a folytatást a dokumentum nem írja le

  - fejezet: "1NT – kontra után"
    szabalyok:
      - {minta: "1NT (X) XX", pont: 0-7, vagy: [{hossz: {C: 5+}}, {hossz: {D: 5+}}], forsz: EGY_MENET,
         prioritas: 55, alert: "Egyszínű minor leállás: 2♣-t kér",
         nyers: "A rendszer továbbra is él. A RDBL egyszínű minor leállást jelent (2♣ licitet kér)."}
