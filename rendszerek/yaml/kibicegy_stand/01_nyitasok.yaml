# NYITÁSOK. A prioritás dönt, ha egy kézre több nyitás is illik:
#   2♣ (95) > 2NT (90) > 1NT (85) > gyenge 2M (70) > 1♠ (62) > 1♥ (61)
#   > 1♦ (51) > 1♣ (50)
# Nyitóerő nélkül a kibic passzol (a szolgáltatás hallgatólagos szabálya).
rendszer: {kod: KIBICEGY_STAND}
fejezetek:
  - fejezet: Nyitások
    szabalyok:
      - minta: 2C
        pont: 22+
        forsz: EGY_MENET
        prioritas: 95
        alert: "Erős 2♣: abszolút forsz, vagy (gém-1)+ a kézben; egyenletessel 22+"
        nyers: "abszolút forsz, vagy (gém -1) + a kézben, egyenletes lap esetén 22+"
        # kieg.: a (gém-1) erejű egyenetlen kezeket ma csak a pont jelzi

      - minta: 2NT
        pont: 20-21
        elosztas: BAL
        prioritas: 90
        magyarazat: "20-21 FP, egyenletes, lehet benne 5-ös nemes"
        nyers: "20-21(22-)FP BAL, lehet benne 5-ös Major szín is."

      - minta: 1NT
        pont: 15-17
        vagy:
          - {elosztas: BAL}
          - {elosztas: ["6322"], vagy: [{hossz: {C: 6}}, {hossz: {D: 6}}]}
        prioritas: 85
        magyarazat: "15-17 FP; 4333, 4432, 5332 vagy 6322 minorral"
        nyers: "15-17 FP; bal (4333) vagy (4432) elosztás, 5332 elosztás, 6322 - minorral"

      # A gyenge kettes a ZÓNÁTÓL függ (mans = nem beli, bell = beli):
      #   O  mans-bell   4-8 FP, lehet 5-ös     A  mans-mans  5-10 FP, lehet 5-ös
      #   M  bell-bell   6-10 FP, 6-7-es        S  bell-mans  8-10 FP, 6-7-es
      - minta: 2H
        hossz: {S: 0-3}          # kieg.: mellette nincs 4-es pikk
        vagy:
          - {szkor: O, pont: 4-8,  hossz: {H: 5-7}}
          - {szkor: A, pont: 5-10, hossz: {H: 5-7}}
          - {szkor: M, pont: 6-10, hossz: {H: 6-7}}
          - {szkor: S, pont: 8-10, hossz: {H: 6-7}}
        forsz: KIZARO
        prioritas: 70
        alert: "Gyenge kettes, zónától függő erővel és hosszal"
        nyers: "Mans-bell: 4-8FP, lehet 5-ös is a szín. Mans-mans: 5-10FP, lehet 5-ös is a szín. Bell-bell: 6-10 FP, 6-7-es szín. Bell-mans: 8-10 FP, 6-7-es szín."
      - minta: 2S
        hossz: {H: 0-3}
        vagy:
          - {szkor: O, pont: 4-8,  hossz: {S: 5-7}}
          - {szkor: A, pont: 5-10, hossz: {S: 5-7}}
          - {szkor: M, pont: 6-10, hossz: {S: 6-7}}
          - {szkor: S, pont: 8-10, hossz: {S: 6-7}}
        forsz: KIZARO
        prioritas: 70
        alert: "Gyenge kettes, zónától függő erővel és hosszal"

      - minta: 1S
        pont: 12-21
        hossz: {S: 5+}
        rel: ["S>=H"]            # 5-5-tel a pikk
        prioritas: 62
        magyarazat: "12-21 FP, 5+ pikk"
        nyers: "(11) 12-21FP-ot ígér 5+ Major színnel."
      - minta: 1H
        pont: 12-21
        hossz: {H: 5+}
        rel: ["H>S"]
        prioritas: 61
        magyarazat: "12-21 FP, 5+ kőr"
        nyers: "(11) 12-21FP-ot ígér 5+ Major színnel."

      # A minor nyitás hosszszabálya a dokumentumban nincs leírva:
      # kieg. a SAYC szerint — a hosszabb minor; 4-4-nél 1♦, 3-3-nál 1♣,
      # 4-4-3-2-ben (3 káró, 2 treff) 1♦.
      - minta: 1D
        pont: 12-21
        hossz: {S: 0-4, H: 0-4}
        vagy:
          - {hossz: {D: 4+}, rel: ["D>=C"]}
          - {hossz: {D: 3, C: 0-2}}
        prioritas: 51
        magyarazat: "12-21 FP, nincs 5-ös nemes, a hosszabb minor (4-4: káró)"
      - minta: 1C
        pont: 12-21
        hossz: {S: 0-4, H: 0-4}
        vagy:
          - {rel: ["C>D"]}
          - {hossz: {C: 3, D: 3}}
        prioritas: 50
        magyarazat: "12-21 FP, nincs 5-ös nemes; 3-3 minorral is 1♣"
