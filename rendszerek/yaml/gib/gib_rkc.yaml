    szabalyok:
      - {minta: ".. 4NT", kulcs: GIB-RKC-C, fajta: ELV, ha: {adu: C}, szlem: igen, ot_biztos: true, kontrollok: true,
         forsz: EGY_MENET, prioritas: 5, alert: "Kulcslapkérdés (treff adu), 0314"}
      - {minta: ".. 4NT", kulcs: GIB-RKC-D, fajta: ELV, ha: {adu: D}, szlem: igen, ot_biztos: true, kontrollok: true,
