# GIB_RKC — Roman Key Card Blackwood, 0314 (a GIB leírása szerint).
#
# 5 kulcslap: a 4 ász és az adu király. A 4NT a kérdés, ha van
# megállapodott adunk (a kényszertár szerint). Válaszok:
#   5♣ 0 vagy 3 · 5♦ 1 vagy 4 · 5♥ 2 (5) adu dáma nélkül · 5♠ 2 (5) dámával
#   5NT páros számú kulcslap + (meg nem nevezett) sikén
#   6x  páratlan számú kulcslap + sikén: az adu 6-os szintje alatt a sikén
#       színében; az adu 6-os szintjén egy magasabb (meg nem nevezett) színben
# Dámakérdés (5♣ / 5♦ után): a következő NEM lezáró lépcső. Válasz: az adu
#   a legolcsóbban = nincs dáma; új szín = dáma + király abban a színben;
#   5NT = dáma, és nincs a 6-os adu alatt mutatható mellékkirály.
# 5NT a kulcslap-válasz után: királykérdés (megvan mind az 5 kulcslap és a
#   dáma). Válasz: nagyszlem, ha 13 ütés látszik; az adunál alacsonyabb
#   színű király a 6-os szinten (több közül a legalacsonyabb); egyébként
#   6 az aduból.
# DOPI: ha az ellenfél a 4NT után beszól: kontra 0, passz 1 kulcslap.
#
# NYITOTT: ha nincs megállapodott adu, a GIB szerint általában a legutóbb
# licitált szín királya az ötödik kulcslap — ezt a kibic még nem kezeli
# (adu nélkül a 4NT itt nem kulcslapkérdés).
rendszer:
  kod: GIB_RKC
  nev: RKC 0314 (GIB)
  nev_en: Roman Key Card Blackwood 0314 (GIB)
  fajta: KONVENCIO
  tema: "Adu megállapodása után: ászkérdés"
  leiras: "4NT kulcslapkérdés 0314: 5♣ 0/3, 5♦ 1/4, 5♥ 2 dáma nélkül, 5♠ 2 dámával; 5NT / 6x sikénnel; dámakérdés; 5NT királykérdés; DOPI."
  forras: https://www.bridgebase.com/doc/gib_system_notes.php
fejezetek:
