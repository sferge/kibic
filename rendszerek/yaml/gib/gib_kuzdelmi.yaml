# licitjei (eszkozok/gib_yaml_ellenorzes.py). A `# kieg.` sávok 2/1-es
# alapértékek. Mellette a GIB az általános NEGATIV_KONTRA (3♠-ig),
# RESZPONZIV_KONTRA (3♠-ig), SUPPORT_KONTRA (2♥-ig), INFORMATIV_KONTRA,
# LEBENSOHL, MICHAELS és SZOKATLAN_2NT konvenciót használja.
#
# NYITOTT: a szendvics 1NT (csak passzolt lappal) — a passzolt lap még nem
# fejezhető ki a mintában.
